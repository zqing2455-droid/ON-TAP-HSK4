window.DU_LIEU = {"bai": 9, "tu_hoc": [{"id": "T1", "yt": "☆ 共同 (bẫy Hán–Việt “cộng đồng”)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Hai người tính cách khác nhau, nhưng có nhiều sở thích CHUNG.", "cau": "他们性格不同，但是有很多______爱好。", "pa": ["共同", "公共", "一起"], "dung": 0, "giai": "共同 = chung (共同爱好 · 共同努力). 公共 = công cộng (公共汽车) · 一起 là phó từ, đứng trước động từ (一起去), không đứng trước danh từ."}, {"id": "T2", "yt": "☆ 幸运 (bẫy 幸福)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Chạy kịp chuyến xe buýt cuối cùng — may thật!", "cau": "我真______，没错过最后一班车。", "pa": ["幸福", "幸运", "美好"], "dung": 1, "giai": "幸运 = may mắn (một lần, một việc). 幸福 = hạnh phúc (cuộc sống lâu dài: 生活很幸福) · 美好 = tốt đẹp (美好的生活), không nói người 很美好."}, {"id": "T3", "yt": "☆ 责任 (danh từ, bẫy 负责)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Anh ấy làm việc rất có tinh thần trách nhiệm.", "cau": "他工作很有______感。", "pa": ["负责", "责任", "认真"], "dung": 1, "giai": "责任 là DANH TỪ: 有责任感 · 这是我的责任. 负责 là động từ / tính từ: 他很负责 · 负责这件事. 认真 không ghép với 感."}, {"id": "T4", "yt": "☆ 实在 (bẫy Hán–Việt “thực tại”)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Anh ấy là người thật thà, nói được là làm được.", "cau": "他这个人很______，说到就做到。", "pa": ["实在", "实际", "现在"], "dung": 0, "giai": "实在 = thật thà, thật lòng (人很实在). 实际 = thực tế (实际上 · 在实际中练习) · 现在 = bây giờ."}, {"id": "T5", "yt": "☆ 对方", "kn": "đọc", "cs": "tu_hoc", "tinh": "Lúc hai người bất đồng, hãy nghĩ nhiều hơn tới cảm nhận của NGƯỜI KIA.", "cau": "两个人意见不同的时候，要多想想______的感受。", "pa": ["对方", "对面", "别的"], "dung": 0, "giai": "对方 = phía bên kia, người kia (trong một mối quan hệ). 对面 = phía đối diện (về vị trí: 学校对面) · 别的 phải có danh từ theo sau (别的人)."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe truyện, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "两个好朋友一起去山里玩儿。突然，一只老虎走了过来。一个人马上爬到了树上，没有管他的朋友。另一个人来不及跑，只好躺在地上，一动也不动。老虎在他头旁边看了看，就走了。树上的人下来问：“老虎跟你说了什么？”朋友说：“它说，遇到危险只想着自己的人，不能当朋友。我从来没想到，你是这样的人。”", "dich": "Hai người bạn thân cùng vào núi chơi. Bỗng có một con hổ đi tới. Một người lập tức trèo lên cây, mặc kệ bạn mình. Người kia không kịp chạy, đành nằm xuống đất, không nhúc nhích. Con hổ nhìn nhìn quanh đầu anh ta rồi bỏ đi. Người trên cây leo xuống hỏi: “Con hổ nói gì với cậu thế?” Người bạn đáp: “Nó bảo, kẻ gặp nguy chỉ biết nghĩ cho mình thì không thể làm bạn. Tớ chưa bao giờ nghĩ cậu lại là người như vậy.”", "cau": [{"id": "NG1-1", "zh": "老虎来的时候，两个人一起爬到了树上。", "dung": false, "yt": "nghe hiểu ý", "cs": "nam_bai", "giai": "Câu gốc: 一个人马上爬到了树上……另一个人来不及跑，只好躺在地上 — chỉ MỘT người trèo cây, người kia nằm dưới đất."}, {"id": "NG1-2", "zh": "老虎没有伤到躺在地上的人。", "dung": true, "yt": "nghe hiểu ý", "cs": "nam_bai", "giai": "Câu gốc: 老虎在他头旁边看了看，就走了 — hổ nhìn rồi bỏ đi, không làm gì anh ta."}, {"id": "NG1-3", "zh": "躺在地上的人对他的朋友很失望。", "dung": true, "yt": "suy luận · 从来没想到", "cs": "nam_bai", "giai": "Bài không nói thẳng “thất vọng”, phải suy ra từ câu cuối: 遇到危险只想着自己的人，不能当朋友。我从来没想到，你是这样的人。"}]}, {"id": "NG2", "loai": "go", "ten": "Nghe truyện, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "老王和妻子结婚四十年了。每天早上，妻子都把面包中间最软的地方给老王，自己吃旁边的。尽管她不太喜欢吃旁边的，但是从来没说过。有一天，老王笑着说：“其实我最喜欢吃旁边的，可是我以为你爱吃，就一直没告诉你。”两个人看着对方，都笑了起来。从此，他们吃面包时，都先问问对方想吃哪儿。", "dich": "Ông Vương và vợ cưới nhau đã bốn mươi năm. Sáng nào bà cũng đưa phần ruột bánh mì mềm nhất cho ông, còn mình ăn phần xung quanh. Dù không thích ăn phần xung quanh lắm, bà chưa bao giờ nói ra. Một hôm, ông Vương cười bảo: “Thật ra tôi thích nhất phần xung quanh, nhưng tôi tưởng bà thích ăn nên cứ không nói.” Hai người nhìn nhau, cùng bật cười. Từ đó, lúc ăn bánh mì, hai ông bà đều hỏi người kia muốn ăn phần nào trước.", "cau": [{"id": "NG2-1", "hoi": "妻子每天早上是怎么分面包的？她喜欢这样吃吗？", "yt": "nghe chi tiết · 尽管……但是 (2 ý)", "cs": "nam_bai", "model": "她把中间软的给老王，自己吃旁边的，可是她不太喜欢吃旁边的。", "more": ["中间软的给老王，她吃旁边的，她不喜欢。", "她把最软的地方给老王，自己吃旁边的。她不太喜欢这样吃。", "把中间给丈夫，自己吃旁边的。她不喜欢吃旁边的。", "软的给老王，旁边的自己吃，可是她不爱吃旁边的。", "她吃旁边的，把中间的给老王。她其实不喜欢。", "不喜欢。她把中间最软的给老王，自己吃旁边的。"], "need": [["中间", "软"], ["不喜欢", "不太喜欢", "不爱", "不想吃"]], "giai": "Câu gốc: 妻子都把面包中间最软的地方给老王，自己吃旁边的。尽管她不太喜欢吃旁边的，但是从来没说过。 — đủ 2 ý: phần mềm cho ông, mình ăn phần xung quanh + bà KHÔNG thích."}, {"id": "NG2-2", "hoi": "这个故事告诉我们什么？", "yt": "suy luận · bài học · ☆ 对方", "cs": "nam_bai", "model": "两个人在一起，要把自己的想法告诉对方。", "more": ["有什么想法要说出来。", "要多和对方交流。", "不要以为自己了解对方，要多问问。", "要把自己喜欢什么告诉对方。", "在一起的人要相互了解对方的想法。", "多问问对方的感受。"], "need": [["告诉", "说出来", "问", "交流", "想法", "感受"]], "avoid": [["不用告诉", "Ngược ý câu chuyện: hai ông bà hiểu lầm suốt 40 năm chính vì KHÔNG nói ra."], ["不要告诉", "Ngược ý câu chuyện: hai ông bà hiểu lầm suốt 40 năm chính vì KHÔNG nói ra."], ["不用说出来", "Ngược ý câu chuyện: hai ông bà hiểu lầm suốt 40 năm chính vì KHÔNG nói ra."]], "giai": "Bài không nói thẳng bài học. Hai người đều nhường nhau nhưng không nói, nên 40 năm cùng ăn phần mình không thích; từ khi hỏi nhau thì hết hiểu lầm. → 要把自己的想法告诉对方 / 多问问对方的感受。"}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "阮兰的日记", "cau": ["我和阿梅是大学同学，已经认识十年了。", "她性格阳光，很有耐心，我对她的印象一直很好。", "尽管我们住在不同的城市，但是常常打电话聊天儿。", "不管工作很忙，她每个月都会给我打电话。", "上个月我生病了，她不说我也知道她很担心。", "她马上坐车来看我，还给我做了饭。", "我从来不去过她的城市，这次决定去看她。", "有这样的朋友，我觉得自己很幸运。"], "loi": [{"i": 3, "id": "DC1-a", "yt": "ôn Bài 8 · 不管……，都……", "cs": "nam_bai", "bai_cu": 8, "model": "不管工作多忙，她每个月都会给我打电话。", "more": ["不管工作有多忙，她每个月都会给我打电话。", "不管工作忙不忙，她每个月都会给我打电话。", "不管工作多忙，她每个月都给我打电话。", "不管她工作多忙，每个月都会给我打电话。", "即使工作很忙，她每个月也会给我打电话。"], "need": [["多忙", "忙不忙", "怎么忙", "忙还是不忙", "即使"], ["都", "也"]], "giai": "Ôn Bài 8: sau 不管 phải là một “lựa chọn” hoặc mức độ chưa định: 不管工作多忙 / 忙不忙. Không nói 不管工作很忙 (很忙 là sự thật cố định). Muốn giữ “很忙” thì dùng 即使工作很忙，她也……"}, {"i": 6, "id": "DC1-b", "yt": "从来没 + V + 过", "cs": "nam_bai", "model": "我从来没去过她的城市，这次决定去看她。", "more": ["我从来没去过她的城市。", "我从来没有去过她的城市，这次决定去看她。", "我从来没去过她住的城市，这次决定去看她。", "我从来没去过她的城市，所以这次决定去看她。", "我从来没去过她那儿，这次我决定去看她。"], "need": [["从来没"], "过"], "avoid": [["从来不去过", "Kể kinh nghiệm “chưa bao giờ đi” → 从来没 + V + 过. 从来不 dùng cho thói quen (从来不喝酒), không đi với 过."]], "order": [["从来没", "过", "过 đứng sau động từ: 从来没去过."]], "giai": "从来不 + V = thói quen, xưa nay không làm (我从来不喝咖啡). 从来没 + V + 过 = chưa từng có kinh nghiệm (我从来没去过). Có 过 thì phải dùng 没."}], "dich": "Mình với A Mai là bạn đại học, quen nhau mười năm rồi. Cô ấy tính tình vui vẻ, rất kiên nhẫn, mình lúc nào cũng có ấn tượng tốt về cô ấy. Dù hai đứa ở hai thành phố khác nhau, nhưng vẫn hay gọi điện tán gẫu. Công việc bận cỡ nào, tháng nào cô ấy cũng gọi cho mình. Tháng trước mình bị ốm, cô ấy không nói mình cũng biết cô ấy rất lo. Cô ấy lập tức bắt xe đến thăm mình, còn nấu cơm cho mình. Mình chưa bao giờ đến thành phố của cô ấy, lần này mình quyết định đi thăm cô ấy. Có người bạn như vậy, mình thấy mình thật may mắn."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "每个星期六的晚饭", "van": "林海和何芳结婚五年了。刚结婚时，两人尽管很忙，但是每个周末都会一起看电影、做饭。后来有了孩子，两人每天都很累，聊天儿的时间越来越少，常常为了小事生气。有一天，何芳问林海：“我们是不是不像以前那么相爱了？”林海从此每个星期六晚上都把孩子送到妈妈家，和何芳一起吃顿饭，聊聊感受。半年后，两人又像刚结婚时那样有说有笑了。何芳说：“原来感情也要__经营__。”", "dich": "Lâm Hải và Hà Phương cưới nhau được năm năm. Mới cưới, dù bận rộn, cuối tuần nào hai người cũng cùng nhau xem phim, nấu cơm. Sau này có con, ngày nào cũng mệt, thời gian trò chuyện ngày càng ít, hay giận nhau vì chuyện vặt. Một hôm, Hà Phương hỏi Lâm Hải: “Có phải mình không còn yêu nhau như trước nữa không?” Từ đó, tối thứ Bảy nào Lâm Hải cũng gửi con sang nhà bà, cùng Hà Phương ăn một bữa, kể cho nhau nghe cảm nhận của mình. Nửa năm sau, hai người lại cười nói vui vẻ như hồi mới cưới. Hà Phương bảo: “Hoá ra tình cảm cũng phải vun đắp.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "林海为什么每个星期六晚上都把孩子送到妈妈家？", "yt": "đọc · lý do (suy luận)", "cs": "nam_bai", "model": "好让他和何芳有时间一起吃饭、聊天儿。", "more": ["为了有两个人的时间。", "他想和妻子一起吃饭聊天儿。", "为了让两人的感情变好。", "让他和何芳能好好聊聊。", "因为他想多陪陪何芳。", "这样两个人就有时间说说自己的感受了。"], "need": [["时间", "聊", "一起", "感情", "陪", "感受"]], "giai": "Bài không nói “因为……”. Suy ra từ việc anh làm sau câu hỏi của vợ: gửi con đi để 和何芳一起吃顿饭，聊聊感受 — dành thời gian riêng cho hai người, giữ tình cảm."}, {"id": "DC2-2", "kieu": "chon", "hoi": "半年以后，何芳对两人的感情是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["很满意，觉得感情又变好了", "很担心，觉得两人不像以前那么相爱了", "不满意，觉得林海不关心自己"], "dung": 0, "giai": "Câu: 半年后，两人又像刚结婚时那样有说有笑了 · 原来感情也要经营 — chị thấy tình cảm đã tốt lại, rất hài lòng. Đáp án 2 là suy nghĩ LÚC TRƯỚC của chị."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“经营”是什么意思？请用简单的中文解释。", "yt": "☆ 经营 · giải thích từ", "cs": "nam_bai", "model": "“经营”就是用心去做，让它越来越好。", "more": ["花时间让感情变好。", "努力让感情越来越好。", "两个人一起用心，让感情更好。", "好好照顾感情，让它不变坏。", "要多做一些事，让关系越来越好。"], "need": [["用心", "努力", "越来越好", "变好", "更好", "花时间", "好好"]], "giai": "经营 vốn là “kinh doanh, quản lý” (经营饭馆), ở đây nghĩa rộng: bỏ công sức, thời gian để giữ và làm cho tình cảm tốt lên — như việc anh chị dành tối thứ Bảy cho nhau."}]}], "san_pham": {"loai": "viet", "de": "写一写你的一位好朋友（或者你的爱人）：你们是怎么认识的？你对他（她）的印象怎么样？你们之间发生过什么让你感动的事？", "de_vi": "Viết về một người bạn thân (hoặc người yêu) của em: hai người quen nhau thế nào? Em có ấn tượng gì về người đó? Giữa hai người từng có chuyện gì làm em cảm động?", "chu_toi_thieu": 100, "giay_toi_thieu": 90, "dan_y": [["① Quen nhau thế nào", "你们是什么时候、在哪儿认识的？（从此 · 此次 · 错过）"], ["② Ấn tượng", "你对他（她）的印象怎么样？性格怎么样？（印象 · 性格 · 耐心 · 吸引）"], ["③ Chuyện cảm động", "发生过什么让你感动的事？（不……也…… · 尽管……，但是…… · 支持 · 理解）"], ["④ Suy nghĩ", "有这样的朋友（爱人），你觉得怎么样？（从来 · 幸运 · 共同）"]], "tu_goi_y": ["印象", "性格", "耐心", "感动", "理解", "支持", "幸运", "共同", "错过", "吸引", "积极", "感受"], "cau_truc": [["不……也……", ["/不[一-鿿]{1,4}也"]], ["尽管……，但是 / 可是……", ["尽管"]], ["此 / 从此", ["此"]], ["从来", ["从来"]]], "can_cau_truc": 2, "can_tu": 4, "bat_buoc": true, "mau": "我和阿明是在一次出差时认识的。此次出差，我们一起工作了一个星期，从此成了好朋友。我对他的第一印象是：话不多，可是做事很负责，对人也很有耐心。去年我找工作的时候，常常被拒绝，心情很不好。尽管他自己也很忙，但是每天晚上都给我打电话，帮我准备面试。有时候我什么也不说，他也知道我在想什么。后来我找到了一份很满意的工作，第一个想感谢的人就是他。我从来没想到，一个普通的同事会成为我最好的朋友。有这样的朋友，我真的很幸运。", "mau_dich": "Mình và A Minh quen nhau trong một chuyến công tác. Chuyến công tác ấy, bọn mình làm việc cùng nhau một tuần, từ đó trở thành bạn thân. Ấn tượng đầu tiên của mình về cậu ấy là: ít nói, nhưng làm việc rất có trách nhiệm, với mọi người cũng rất kiên nhẫn. Năm ngoái lúc tìm việc, mình hay bị từ chối, tâm trạng rất tệ. Dù bản thân cũng bận, tối nào cậu ấy cũng gọi cho mình, giúp mình chuẩn bị phỏng vấn. Có lúc mình chẳng nói gì, cậu ấy cũng biết mình đang nghĩ gì. Sau đó mình tìm được một công việc rất ưng ý, người đầu tiên mình muốn cảm ơn chính là cậu ấy. Mình chưa bao giờ nghĩ một người đồng nghiệp bình thường lại thành người bạn thân nhất của mình. Có người bạn như vậy, mình thật sự rất may mắn.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng ít nhất 2 cấu trúc của bài (不……也…… · 尽管……但是 · 此 / 从此 · 从来)", "Từ ★ dùng đúng lúc, đúng cách", "Mạch lạc: có từ nối, ý nối nhau"]}, "audio": {"NG1": "audio-bai-09/nghe-1.m4a", "NG2": "audio-bai-09/nghe-2.m4a"}};
