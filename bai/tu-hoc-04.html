window.DU_LIEU = {"bai": 4, "tu_hoc": [{"id": "T1", "yt": "☆ 食物 (bẫy Hán–Việt)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Trong ga tàu điện ngầm có thể quét mã mua ĐỒ ĂN và đồ uống.", "cau": "在地铁站里可以扫码购买______和饮料。", "pa": ["植物", "食物", "动物"], "dung": 1, "giai": "食物 = đồ ăn, thức ăn (KHÔNG phải “thực vật”). “Thực vật” là 植物 · 动物 = động vật."}, {"id": "T2", "yt": "☆ 信号", "kn": "đọc", "cs": "tu_hoc", "tinh": "Điện thoại không có sóng nên không lên mạng được.", "cau": "手机没有______，上不了网。", "pa": ["信号", "信息", "号码"], "dung": 0, "giai": "信号 = sóng, tín hiệu: 没有信号 · 信号不好. 信息 = thông tin, tin nhắn · 号码 = số (điện thoại)."}, {"id": "T3", "yt": "☆ 速度 · 距离", "kn": "đọc", "cs": "tu_hoc", "tinh": "Xe điện chạy rất nhanh (tốc độ nhanh).", "cau": "电动车的______很快。", "pa": ["距离", "速度", "时间"], "dung": 1, "giai": "速度 + 快 / 慢: 速度很快. 距离 đi với 远 / 近: 距离不远 · 时间 đi với 长 / 短."}, {"id": "T4", "yt": "☆ 之间 (bẫy 中间)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Hàng xóm với nhau nên giúp đỡ lẫn nhau.", "cau": "邻居______应该互相帮助。", "pa": ["中间", "互相", "之间"], "dung": 2, "giai": "N + 之间 = giữa (quan hệ giữa người với người): 邻居之间 · 朋友之间. 中间 = ở giữa (vị trí) · 互相 đã có sẵn ở sau."}, {"id": "T5", "yt": "☆ 乘客 (bẫy 客人)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Giờ tan tầm trên tàu điện ngầm có rất nhiều HÀNH KHÁCH.", "cau": "下班的时候，地铁上的______特别多。", "pa": ["客人", "乘客", "顾客"], "dung": 1, "giai": "乘客 = người đi tàu, xe. 客人 = khách đến nhà · 顾客 = khách mua hàng ở cửa hàng."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe truyện, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "马和牛比赛，看谁先跑到河边。马跑得很快，牛走得很慢。马想：“牛这么慢，我睡一会儿也来得及。”就在一棵大树下睡着了。牛知道自己跑不快，可是它一直没有停，一步一步往前走。马醒来的时候，太阳快下山了，它马上往河边跑，可是已经来不及了：牛早就到了。觉得时间来得及的人，往往会来不及。", "dich": "Ngựa và bò thi xem ai chạy tới bờ sông trước. Ngựa chạy rất nhanh, bò thì đi rất chậm. Ngựa nghĩ: “Bò chậm thế này, mình ngủ một lát cũng còn kịp.” Thế là nó nằm ngủ luôn dưới một gốc cây to. Bò biết mình không chạy nhanh được, nhưng nó không dừng lại lúc nào, cứ từng bước từng bước đi tới. Lúc ngựa tỉnh dậy thì mặt trời sắp lặn, nó vội chạy ra bờ sông, nhưng không kịp nữa rồi: bò đã tới từ lâu. Ai nghĩ mình còn thừa thời gian thì thường lại là người không kịp.", "cau": [{"id": "NG1-1", "zh": "马觉得自己睡一会儿也来得及。", "dung": true, "yt": "nghe chi tiết · 来得及", "cs": "nam_bai", "giai": "Câu gốc: 马想：“牛这么慢，我睡一会儿也来得及。”"}, {"id": "NG1-2", "zh": "牛觉得自己跑得快，一定能先到河边。", "dung": false, "yt": "nghe chi tiết · 跑不快", "cs": "nam_bai", "giai": "Câu gốc: 牛知道自己跑不快，可是它一直没有停 — bò biết mình KHÔNG chạy nhanh được, chỉ là không dừng lại."}, {"id": "NG1-3", "zh": "马醒来的时候，牛已经到河边了。", "dung": true, "yt": "nghe chi tiết · 来不及", "cs": "nam_bai", "giai": "Câu gốc: 可是已经来不及了：牛早就到了。"}]}, {"id": "NG2", "loai": "go", "ten": "Nghe truyện, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "小羊在森林里看见一只小鸟。小鸟受伤了，飞不了了。小羊把它带回家，每天给它找吃的。没过几天，小鸟的伤就好了。有一次，小羊走得太远，天黑了，找不到回家的路。它正着急，小鸟飞来了，说：“别怕，我飞得高，看得远，我带你回家。再说，你帮过我，现在该我帮你了。”朋友之间就应该互相帮助。", "dich": "Dê con gặp một chú chim nhỏ trong rừng. Chim bị thương, không bay được nữa. Dê con mang chim về nhà, ngày nào cũng đi kiếm đồ ăn cho chim. Chẳng mấy hôm, vết thương của chim đã lành. Có một lần, dê con đi xa quá, trời tối mất, không tìm được đường về nhà. Đang cuống thì chim nhỏ bay tới, bảo: “Đừng sợ, tớ bay cao, nhìn được xa, để tớ đưa cậu về. Vả lại cậu từng giúp tớ, giờ đến lượt tớ giúp cậu.” Bạn bè với nhau thì phải giúp đỡ lẫn nhau.", "cau": [{"id": "NG2-1", "hoi": "小鸟为什么飞不了了？", "yt": "nghe chi tiết · V不了", "cs": "nam_bai", "model": "因为它受伤了。", "more": ["它受伤了。", "小鸟受伤了。", "因为小鸟受了伤。", "受伤了。", "小鸟受伤了，所以飞不了了。"], "need": ["伤"], "avoid": [["天黑", "Trời tối là lúc dê con lạc đường, không phải lý do chim không bay được."]], "giai": "Câu gốc: 小鸟受伤了，飞不了了。"}, {"id": "NG2-2", "hoi": "小羊找不到回家的路时，小鸟是怎么帮它的？", "yt": "nghe chi tiết · 再说", "cs": "nam_bai", "model": "小鸟带小羊回家。", "more": ["带它回家。", "小鸟飞得高，看得远，带小羊回到了家。", "给小羊带路，带它回家。", "帮小羊找到回家的路。", "它带小羊回家了。"], "need": [["回家", "回到了家", "回到家"]], "avoid": [["找吃的", "Kiếm đồ ăn là việc dê con làm cho chim, không phải chim giúp dê."], ["小羊把", "Dê con mang chim về nhà là chuyện lúc ĐẦU; câu hỏi hỏi chim giúp dê thế nào."], ["把小鸟带回家", "Dê con mang chim về nhà là chuyện lúc ĐẦU; câu hỏi hỏi chim giúp dê thế nào."]], "giai": "Câu gốc: 我飞得高，看得远，我带你回家。再说，你帮过我，现在该我帮你了。"}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "何小月的日记", "cau": ["今天早上我起晚了。", "我不来得及吃早饭，就跑去了地铁站。", "站里有一辆早餐车，包子既便宜又好吃。", "我拿了两个包子，可是手机没电了，扫码不了。", "我正着急，旁边一位阿姨帮我付了钱。", "我想把钱还给她，就问她的联系方式。", "她笑着说：“几块钱算什么？再说，我以前也得到过别人的帮助。”", "下班的时候，我在地铁站又看到了她，就请她喝了一杯咖啡。", "今天我的心情特别愉快。"], "loi": [{"i": 1, "id": "DC1-a", "yt": "NP4 来得及 / 来不及", "cs": "nam_bai", "model": "我没来得及吃早饭，就跑去了地铁站。", "more": ["我来不及吃早饭，就跑去了地铁站。", "我没来得及吃早饭就跑去了地铁站。", "我没来得及吃早饭，就去了地铁站。", "没来得及吃早饭，我就跑去了地铁站。", "我没来得及吃早饭。"], "need": [["没来得及", "来不及"]], "avoid": [["不来得及", "Phủ định của 来得及 là 来不及 (sắp tới) / 没来得及 (đã qua), không nói 不来得及."]], "giai": "Phủ định cố định: 来不及 / 没来得及. Chuyện sáng nay đã xảy ra → 没来得及吃早饭. Không nói 不来得及."}, {"i": 3, "id": "DC1-b", "yt": "NP1 V + 不了", "cs": "nam_bai", "model": "我拿了两个包子，可是手机没电了，扫不了码。", "more": ["可是手机没电了，扫不了码。", "我拿了两个包子，可是手机没电了，扫不了码了。", "手机没电了，扫不了码。", "我拿了两个包子，可是手机没电，扫不了码。", "我拿了两个包子，可是手机没电了，不能扫码。"], "need": [["扫不了", "不能扫码"]], "avoid": [["码不了", "扫码 là động từ ly hợp: chen 不了 vào giữa → 扫不了码."]], "giai": "扫码 giống 上网: chen 不了 vào giữa động từ và tân ngữ → 扫不了码 (như 上不了网). Không nói 扫码不了."}], "dich": "Sáng nay mình dậy muộn. Mình chưa kịp ăn sáng đã chạy ra ga tàu điện ngầm. Trong ga có một xe bán đồ ăn sáng, bánh bao vừa rẻ vừa ngon. Mình lấy hai cái bánh bao, nhưng điện thoại hết pin, không quét mã được. Đang cuống thì một cô bên cạnh trả tiền giúp mình. Mình muốn trả lại tiền nên hỏi cách liên lạc với cô. Cô cười bảo: “Mấy đồng thì có đáng gì? Vả lại trước đây cô cũng từng được người khác giúp.” Lúc tan làm, mình lại gặp cô ở ga, thế là mời cô một cốc cà phê. Hôm nay tâm trạng mình vui ơi là vui."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "高叔叔骑车上班", "van": "高叔叔今年五十岁，以前每天开车上班。最近他不开车了，改骑自行车上班。他说，公司距离他家只有三公里，可是路上车太多，开车往往要花四十分钟，停车也不方便；骑车只要二十分钟，既省时间，又能锻炼身体。现在在他们公司，骑车上班越来越__流行__，很多年轻人也跟他一起骑。女儿担心他太辛苦，他却笑着说：“一点儿也不辛苦，我觉得身体比以前好了，心情也更加愉快了。”", "dich": "Chú Cao năm nay năm mươi tuổi, trước đây ngày nào cũng lái ô tô đi làm. Gần đây chú không lái xe nữa mà chuyển sang đạp xe đi làm. Chú bảo công ty chỉ cách nhà ba cây số, nhưng đường đông xe quá, lái xe thường mất bốn mươi phút, đỗ xe cũng bất tiện; đạp xe chỉ mất hai mươi phút, vừa đỡ tốn thời gian, vừa rèn luyện được sức khoẻ. Giờ ở công ty chú, đạp xe đi làm ngày càng thịnh hành, nhiều bạn trẻ cũng đạp xe cùng chú. Con gái lo chú vất vả quá, chú lại cười bảo: “Chẳng vất vả chút nào, bố thấy sức khoẻ tốt hơn trước, tâm trạng cũng vui vẻ hơn.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "高叔叔为什么不开车上班了？（说出一个原因就可以）", "yt": "đọc · lý do", "cs": "nam_bai", "model": "因为路上车太多，开车往往要花四十分钟。", "more": ["开车太慢了。", "停车不方便。", "骑车既省时间，又能锻炼身体。", "因为骑车只要二十分钟。", "骑车可以锻炼身体。"], "need": [["车太多", "车很多", "慢", "四十分钟", "停车", "省时间", "二十分钟", "锻炼"]], "avoid": [["流行", "Đạp xe “thịnh hành” ở công ty là chuyện SAU khi chú đổi cách đi, không phải lý do chú bỏ lái xe."]], "giai": "Lý do nằm trong câu: 路上车太多，开车往往要花四十分钟，停车也不方便；骑车只要二十分钟，既省时间，又能锻炼身体."}, {"id": "DC2-2", "kieu": "chon", "hoi": "高叔叔对骑车上班是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["很满意，觉得一点儿也不辛苦", "觉得太辛苦，想再开车上班", "觉得骑车不安全，不太喜欢"], "dung": 0, "giai": "Câu cuối: 一点儿也不辛苦，我觉得身体比以前好了，心情也更加愉快了 — chú rất hài lòng."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“流行”是什么意思？请用简单的中文解释。", "yt": "★ 流行 · giải thích từ", "cs": "nam_bai", "model": "“流行”就是很多人都喜欢、都这样做的意思。", "more": ["很多人都这样做。", "大家都喜欢。", "越来越多的人骑车上班。", "很受欢迎。", "不少人都喜欢这样做。"], "need": [["很多人", "大家", "越来越多", "欢迎", "不少人"]], "giai": "流行 = 很多人都喜欢、都这样做: 骑车上班越来越流行 → ngày càng nhiều người đạp xe đi làm (… 很多年轻人也跟他一起骑)."}]}], "san_pham": {"loai": "noi", "de": "说说你平时的出行方式：你每天怎么去上班或者上学？为什么这样选择？路上遇到过什么麻烦，有没有人帮过你？", "de_vi": "Kể về cách em đi lại hằng ngày: em đi làm / đi học bằng gì? Vì sao chọn cách đó? Trên đường em từng gặp rắc rối gì, có ai giúp em không?", "chu_toi_thieu": 200, "giay_toi_thieu": 90, "dan_y": [["① Mở đầu", "你住在哪儿？距离公司 / 学校远吗？你每天怎么去？"], ["② Lý do", "为什么选择这种出行方式？（既……又…… · 再说…… · 省时间 · 往往）"], ["③ Một lần gặp rắc rối", "有一次路上发生了什么？（……不了 · 来不及 · 谁帮了你？你怎么感谢他？）"], ["④ Kết", "你对现在的出行方式满意吗？以后有什么打算？（心情 · 更加）"]], "tu_goi_y": ["往往", "既", "省", "流行", "来得及", "顺便", "停", "联系", "客气", "辛苦", "心情", "更加"], "cau_truc": [["V + 得了 / 不了", ["得了", "不了"]], ["……，再说……", ["再说"]], ["既……，又 / 也……", ["既"]], ["来得及 / 来不及", ["来得及", "来不及"]]], "can_cau_truc": 2, "can_tu": 4, "mau": "我住在河内，家距离公司六公里。以前我往往坐公共汽车上班，可是车上人太多，路上又常常要停，有时候七点出门都来不及。去年我买了一辆电动车，每天骑车上班。骑电动车既方便，又省时间，再说价格也不高，所以在河内越来越流行。下班的时候还能顺便买点儿菜。上个月有一天，我的电动车突然坏了，骑不了了，手机也没电了，联系不了家人。我正着急，一位大叔停下来帮我看了看，很快就修好了。我想请他喝杯咖啡，他笑着说：“别客气，大家应该互相帮助。”那天我的心情特别好。现在我对我的出行方式很满意，以后我也想更加主动地帮助别人。", "mau_dich": "Mình sống ở Hà Nội, nhà cách công ty sáu cây số. Trước đây mình thường đi xe buýt đi làm, nhưng trên xe đông quá, dọc đường lại hay phải dừng, có hôm bảy giờ ra khỏi nhà mà vẫn không kịp. Năm ngoái mình mua một chiếc xe điện, ngày nào cũng đi xe điện đi làm. Đi xe điện vừa tiện vừa đỡ tốn thời gian, vả lại giá cũng không cao, nên ở Hà Nội ngày càng nhiều người đi. Tan làm còn tiện mua luôn ít rau. Có một hôm tháng trước, xe điện của mình tự dưng hỏng, không chạy được nữa, điện thoại cũng hết pin, không liên lạc được với người nhà. Đang cuống thì một chú dừng lại xem giúp, sửa xong rất nhanh. Mình muốn mời chú cốc cà phê, chú cười bảo: “Đừng khách sáo, mọi người nên giúp đỡ nhau mà.” Hôm đó tâm trạng mình vui lắm. Giờ mình rất hài lòng với cách đi lại của mình, sau này mình cũng muốn chủ động giúp đỡ người khác nhiều hơn.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài (V不了 · 再说 · 既……又…… · 来得及)", "Phát âm, thanh điệu người nghe hiểu", "Nói liền mạch, đủ ≈ 90 giây"]}, "audio": {}};
