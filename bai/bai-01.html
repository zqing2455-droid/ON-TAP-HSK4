window.CHE_DO = 'on';
window.DU_LIEU = {"bai": 1, "tu_hoc": [{"id": "T1", "yt": "☆ 证件", "kn": "đọc", "cs": "tu_hoc", "tinh": "Đi máy bay nhớ mang theo giấy tờ tùy thân.", "cau": "坐飞机一定要带好______。", "pa": ["课程", "证件", "食堂"], "dung": 1, "giai": "证件 = giấy tờ tùy thân (hộ chiếu, căn cước). 课程 = chương trình học · 食堂 = nhà ăn."}, {"id": "T2", "yt": "☆ 座", "kn": "đọc", "cs": "tu_hoc", "tinh": "Trường mình giống như một thành phố nhỏ.", "cau": "学校就像一______小城市。", "pa": ["本", "张", "座"], "dung": 2, "giai": "座 dùng cho vật to, cố định: 一座城市 · 一座山. 坐 (ngồi) không có 广."}, {"id": "T3", "yt": "☆ 博士 (bẫy Hán–Việt)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Anh ấy là TIẾN SĨ kinh tế.", "cau": "他是经济学______。", "pa": ["博士", "医生", "教师"], "dung": 0, "giai": "⚠ 博士 đọc Hán–Việt là “bác sĩ” nhưng nghĩa là TIẾN SĨ. Bác sĩ chữa bệnh → 医生 / 大夫."}, {"id": "T4", "yt": "☆ 研究生 (bẫy Hán–Việt)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Em gái tôi đang học THẠC SĨ ở Bắc Kinh.", "cau": "我妹妹在北京读______。", "pa": ["本科", "研究生", "博士"], "dung": 1, "giai": "⚠ 研究生 = học viên sau đại học, gồm CẢ thạc sĩ (硕士研究生). Không phải chỉ “nghiên cứu sinh” tiến sĩ."}, {"id": "T5", "yt": "☆ 另", "kn": "đọc", "cs": "tu_hoc", "tinh": "Cái áo này to quá, em muốn đổi cái khác.", "cau": "这件衣服太大了，我想换______一件。", "pa": ["别的", "另", "其他"], "dung": 1, "giai": "另 + 一 + lượng từ: 另一件 · 另一方面. 别的 / 其他 không đi với 一件 (别的衣服 · 其他衣服)."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe đoạn văn, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "我叫陈天中，来中国留学已经一个星期了。上周一，我和白家月一起去学院办公室办理入学手续，老师很快就给了我们学生证。老师说，下周一开始上课，先试听两个星期，然后再在网上选课。我们学校有三个食堂，我最喜欢二号食堂，那里的饭又便宜又好吃。老师还告诉我们，成绩好的学生可以申请奖学金，所以我打算好好学习。", "dich": "Tôi là Trần Thiên Trung, sang Trung Quốc du học được một tuần rồi. Thứ Hai tuần trước, tôi và Bạch Gia Nguyệt cùng đến văn phòng khoa làm thủ tục nhập học, cô giáo đưa thẻ sinh viên cho chúng tôi rất nhanh. Cô nói thứ Hai tuần sau bắt đầu học, hai tuần đầu học thử, sau đó đăng ký môn trên mạng. Trường có ba nhà ăn, tôi thích nhà ăn số 2 nhất, cơm ở đó vừa rẻ vừa ngon. Cô còn bảo sinh viên học giỏi có thể xin học bổng, nên tôi định học hành chăm chỉ.", "cau": [{"id": "NG1-1", "zh": "陈天中是一个人去办理入学手续的。", "dung": false, "yt": "nghe chi tiết", "cs": "nam_bai", "giai": "Câu gốc: 我和白家月一起去学院办公室办理入学手续 — đi cùng Bạch Gia Nguyệt."}, {"id": "NG1-2", "zh": "他们要先试听两个星期，然后再选课。", "dung": true, "yt": "nghe chi tiết · 试听 / 选课", "cs": "nam_bai", "giai": "Câu gốc: 先试听两个星期，然后再在网上选课。"}, {"id": "NG1-3", "zh": "陈天中觉得二号食堂的饭太贵了。", "dung": false, "yt": "nghe chi tiết", "cs": "nam_bai", "giai": "Câu gốc: 那里的饭又便宜又好吃 — rẻ, không đắt."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe đoạn văn, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "大家好，我叫安妮，是从法国来的留学生，下个学期就要选专业了。很多朋友觉得我会选经济专业，因为学经济的人将来比较容易找到工作。可是我最后选择了国际中文教育专业。一方面，我从小就对中国文化很感兴趣，特别喜欢中国历史；另一方面，我觉得教别人学习语言是一件很有意思的事情。所以我打算毕业以后回国，当一名中文老师。", "dich": "Chào mọi người, mình là Annie, du học sinh đến từ Pháp, học kỳ sau là phải chọn chuyên ngành rồi. Nhiều bạn nghĩ mình sẽ chọn ngành kinh tế, vì học kinh tế sau này dễ tìm việc hơn. Nhưng cuối cùng mình chọn ngành Giáo dục Hán ngữ quốc tế. Một mặt, từ nhỏ mình đã thích văn hoá Trung Quốc, đặc biệt là lịch sử Trung Quốc; mặt khác, mình thấy dạy người khác học ngôn ngữ là việc rất thú vị. Vì vậy mình định tốt nghiệp xong sẽ về nước làm giáo viên tiếng Trung.", "cau": [{"id": "NG2-1", "hoi": "安妮为什么选择国际中文教育专业？（说出一个原因就可以）", "yt": "nghe ý · 一方面……另一方面", "cs": "nam_bai", "model": "因为她从小就对中国文化很感兴趣。", "more": ["她喜欢中国文化。", "她特别喜欢中国历史。", "她觉得教别人学习语言很有意思。", "一方面她对中国文化感兴趣，另一方面她觉得教别人学语言很有意思。", "因为她对中国历史很感兴趣。"], "need": [["中国文化", "历史", "教别人", "有意思"]], "avoid": [["容易找到工作", "Đó là lý do để chọn ngành KINH TẾ — Annie không chọn ngành đó."]], "giai": "Hai lý do nằm sau 一方面……另一方面……: thích văn hoá, lịch sử Trung Quốc · thấy dạy ngôn ngữ cho người khác rất thú vị."}, {"id": "NG2-2", "hoi": "安妮毕业以后打算做什么？", "yt": "nghe chi tiết · 当", "cs": "nam_bai", "model": "她打算回国当一名中文老师。", "more": ["回国当中文老师。", "当中文老师。", "她想成为一名中文老师。", "回法国教中文。", "她打算回法国当老师。"], "need": [["老师", "教师", "教中文"]], "avoid": [["经济", "Annie không học / không làm về kinh tế."]], "giai": "Câu gốc: 我打算毕业以后回国，当一名中文老师。"}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "白家月的日记", "cau": ["来中国一个多月了，我慢慢适应了这里的生活。", "刚到的时候，我什么都不知道。", "还好王老师很热情，她告诉我们，有任何的问题都可以去问她。", "现在我每天上午上中文课，下午去图书馆看书。", "我们班的同学来自八个国家，大家用中文交流。", "下个周末，学校要带我们去爬长城。", "要是周末不下雨，就我们早上七点出发。", "妈妈常常打电话问我习惯不习惯，我说都很好，请她放心。"], "loi": [{"i": 2, "id": "DC1-a", "yt": "NP1 任何", "cs": "nam_bai", "model": "还好王老师很热情，她告诉我们，有任何问题都可以去问她。", "more": ["她告诉我们，有任何问题都可以去问她。", "有任何问题都可以去问她。", "她告诉我们有任何问题都可以问她。", "还好王老师很热情，她说我们有任何问题都可以去问她。", "有任何问题，都可以去问她。"], "need": ["任何问题", "都"], "avoid": [["任何的", "任何 + danh từ trực tiếp, không có 的."]], "giai": "任何 đi thẳng với danh từ: 任何问题 · 任何人 — không thêm 的."}, {"i": 6, "id": "DC1-b", "yt": "NP2 要是……就", "cs": "nam_bai", "model": "要是周末不下雨，我们就早上七点出发。", "more": ["要是周末不下雨，我们早上七点就出发。", "要是周末不下雨的话，我们就早上七点出发。", "周末要是不下雨，我们就早上七点出发。", "要是周末不下雨，我们就七点出发。", "要是不下雨，我们早上七点就出发。"], "need": ["要是", "我们", "就", "出发"], "avoid": [["就我们", "就 đứng SAU chủ ngữ: 我们就……, không nói 就我们……."]], "order": [["我们", "就", "就 đứng SAU chủ ngữ 我们."]], "giai": "要是 A，S 就 B — 就 là phó từ, đứng sau chủ ngữ, trước động từ."}], "dich": "Sang Trung Quốc đã hơn một tháng, mình dần quen với cuộc sống ở đây. Mới đến, mình chẳng biết gì cả. May mà cô Vương rất nhiệt tình, cô bảo có bất cứ vấn đề gì cũng có thể đến hỏi cô. Giờ sáng nào mình cũng học tiếng Trung, chiều lên thư viện đọc sách. Các bạn lớp mình đến từ tám nước, mọi người giao tiếp bằng tiếng Trung. Cuối tuần sau, trường đưa bọn mình đi leo Vạn Lý Trường Thành. Nếu cuối tuần không mưa thì 7 giờ sáng chúng mình xuất phát. Mẹ hay gọi điện hỏi mình đã quen chưa, mình bảo mọi thứ đều ổn, mẹ cứ yên tâm."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "李明的选择", "van": "李明大学毕业以后，在一家公司工作了两年。工作虽然不错，可是他总觉得自己的知识不够用。去年，他决定去中国读硕士。父母一开始不太同意，他们觉得儿子已经有了不错的工作，而且留学要花很多钱。李明告诉父母，他可以申请奖学金，减轻家里的经济压力。最后，父母同意了。现在，他不但__获得__了学校的奖学金，还找到了一个在国际公司工作的机会。", "dich": "Lý Minh tốt nghiệp đại học xong làm ở một công ty hai năm. Công việc tuy không tệ nhưng anh luôn thấy kiến thức của mình chưa đủ dùng. Năm ngoái anh quyết định sang Trung Quốc học thạc sĩ. Ban đầu bố mẹ không đồng ý lắm, họ nghĩ con trai đã có công việc khá tốt, hơn nữa du học tốn rất nhiều tiền. Lý Minh nói với bố mẹ rằng anh có thể xin học bổng, đỡ áp lực tiền bạc cho gia đình. Cuối cùng bố mẹ đồng ý. Giờ đây anh không chỉ giành được học bổng của trường mà còn tìm được một cơ hội làm việc ở công ty quốc tế.", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "李明的父母一开始为什么不太同意？", "yt": "đọc · lý do", "cs": "nam_bai", "model": "因为他们觉得儿子已经有了不错的工作，而且出国留学要花很多钱。", "more": ["因为他已经有了一份不错的工作。", "因为留学要花很多钱。", "他们觉得儿子的工作已经很不错了。", "因为李明有工作，而且留学很贵。", "他们觉得出国留学花钱太多。"], "need": [["工作", "钱", "贵", "不需要"]], "avoid": [["知识不够", "Đó là lý do của LÝ MINH muốn đi học, không phải lý do bố mẹ phản đối."]], "giai": "Đoạn văn nêu 2 lý do sau 他们觉得……: con đã có việc tốt · du học tốn nhiều tiền."}, {"id": "DC2-2", "kieu": "chon", "hoi": "李明对自己原来的工作是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["很满意，一点儿也不想离开", "觉得不错，可是觉得自己的知识不够用", "很不喜欢，觉得工作太累了"], "dung": 1, "giai": "工作虽然不错，可是他总觉得自己的知识不够用 — 虽然……可是…… cho thấy anh thấy việc ổn nhưng vẫn muốn học thêm."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“获得”是什么意思？请用简单的中文解释。", "yt": "★ 获得 · giải thích từ", "cs": "nam_bai", "model": "“获得”就是“得到”的意思。", "more": ["得到。", "拿到。", "他得到了学校的奖学金。", "获得就是通过努力得到。", "就是拿到了奖学金。"], "need": [["得到", "拿到", "收到"]], "giai": "获得 = 得到 / 拿到 — thường là thứ có giá trị, nhờ nỗ lực mà có (奖学金 · 机会 · 成功)."}]}], "san_pham": {"loai": "viet", "de": "如果有机会去中国留学，你想学什么专业？为什么？", "de_vi": "Nếu có cơ hội sang Trung Quốc du học, em muốn học ngành gì? Vì sao?", "chu_toi_thieu": 100, "giay_toi_thieu": 90, "dan_y": [["① Mở đầu", "你学中文多长时间了？想去中国哪个城市留学？"], ["② Ngành học và lý do", "你想学什么专业？为什么？（一方面……，另一方面……）"], ["③ Chuẩn bị", "去留学以前要准备什么？（材料 · 申请奖学金 · 适应新生活……）"], ["④ Kết", "将来有什么打算？（要是……就…… · 将来想当 / 成为……）"]], "tu_goi_y": ["留学", "申请", "奖学金", "材料", "专业", "硕士", "适应", "交流", "知识", "压力", "将来", "成为"], "cau_truc": [["一方面……另一方面……", ["另一方面"]], ["要是……就……", ["要是", "就"]], ["随着……", ["随着"]], ["任何……都……", ["任何"]]], "can_cau_truc": 2, "can_tu": 4, "mau": "我学中文已经两年了。要是有机会去中国留学，我想去上海读国际贸易专业。我选这个专业，一方面是因为我对经济很感兴趣，另一方面是因为我现在在一家国际公司工作，很需要这方面的知识。去留学以前，我要准备很多材料，比如护照、照片和申请表，还要申请奖学金，这样就能减轻家里的经济压力。刚到中国的时候，我可能会不太适应，但是我会多跟中国同学交流。将来我希望成为一名优秀的翻译。", "mau_dich": "Mình học tiếng Trung đã hai năm. Nếu có cơ hội sang Trung Quốc du học, mình muốn học ngành thương mại quốc tế ở Thượng Hải. Mình chọn ngành này một mặt vì thích kinh tế, mặt khác vì hiện mình làm ở một công ty quốc tế, rất cần kiến thức về mảng này. Trước khi đi phải chuẩn bị nhiều hồ sơ như hộ chiếu, ảnh, đơn xin, còn phải xin học bổng để đỡ áp lực tiền bạc cho gia đình. Mới sang có thể chưa quen lắm, nhưng mình sẽ giao lưu nhiều với bạn Trung Quốc. Sau này mình mong trở thành một phiên dịch giỏi.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài", "Từ ★ dùng đúng lúc, đúng cách", "Mạch lạc: có từ nối, ý nối nhau"]}, "audio": {"NG1": "audio-bai-01/nghe-1.m4a", "NG2": "audio-bai-01/nghe-2.m4a"}};
</script>
