window.CHE_DO = 'tuhoc';
window.DU_LIEU = {"bai": 10, "tu_hoc": [{"id": "T1", "yt": "☆ 温度 (bẫy 气温)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Nước tắm nóng quá!", "cau": "洗澡水的______太高了。", "pa": ["气温", "温度", "天气"], "dung": 1, "giai": "温度 = nhiệt độ của mọi thứ (nước, phòng, người). 气温 chỉ nhiệt độ KHÔNG KHÍ (今天气温很低) · 天气 = thời tiết, không nói 天气太高."}, {"id": "T2", "yt": "☆ 冻", "kn": "đọc", "cs": "tu_hoc", "tinh": "Để hoa quả trong tủ lạnh lâu quá, đông đá hỏng hết rồi.", "cau": "水果在冰箱里放太久，都______坏了。", "pa": ["冻", "冷", "凉"], "dung": 0, "giai": "冻 = đông cứng, bị lạnh làm hỏng: 冻坏了 · 冻成冰. 冷 / 凉 là tính từ chỉ cảm giác lạnh, mát; đồ vật bị hỏng vì lạnh thì dùng 冻."}, {"id": "T3", "yt": "☆ 此外", "kn": "đọc", "cs": "tu_hoc", "tinh": "Quán này đồ ăn ngon, NGOÀI RA giá cũng không đắt.", "cau": "这家饭馆的菜很好吃，______，价格也不贵。", "pa": ["此外", "以外", "以后"], "dung": 0, "giai": "此外 = ngoài ra, đứng đầu vế để nói thêm một ý (= 另外). 以外 phải đi sau danh từ (除了……以外) · 以后 = sau này, sau khi."}, {"id": "T4", "yt": "☆ 方言", "kn": "đọc", "cs": "tu_hoc", "tinh": "Bạn ấy là người Quảng Châu, ở nhà nói tiếng địa phương, ở trường nói tiếng phổ thông.", "cau": "他是广州人，在家说______，在学校说普通话。", "pa": ["方言", "语言", "外语"], "dung": 0, "giai": "方言 = tiếng địa phương (广州方言). 语言 = ngôn ngữ nói chung (không nói 在家说语言) · 外语 = ngoại ngữ."}, {"id": "T5", "yt": "☆ 资源", "kn": "đọc", "cs": "tu_hoc", "tinh": "Nước là tài nguyên quý, chúng ta phải tiết kiệm.", "cau": "水是很重要的______，我们要节约用水。", "pa": ["资源", "资料", "原因"], "dung": 0, "giai": "资源 = tài nguyên (水资源 · 节约资源). 资料 = tài liệu (查资料) · 原因 = nguyên nhân."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe truyện, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "北风和太阳想比一比谁更厉害。北风说：“谁能让路上那个人把厚衣服脱下来，谁就赢了。”北风先来，它用力地吹，可是风越大，那个人把衣服穿得越紧。北风再次用力，还是没有用。接着，太阳出来了，它只是慢慢地照着大地。天气越来越暖和，那个人热得受不了，自己就把厚衣服脱了下来。", "dich": "Gió Bấc và Mặt Trời muốn so xem ai giỏi hơn. Gió Bấc nói: “Ai làm cho người đi đường kia cởi áo dày ra thì người đó thắng.” Gió Bấc ra tay trước, nó thổi thật mạnh, nhưng gió càng to, người kia càng quấn áo chặt hơn. Gió Bấc lại dốc sức lần nữa, vẫn chẳng ăn thua. Tiếp đó Mặt Trời ló ra, nó chỉ từ từ chiếu xuống mặt đất. Trời mỗi lúc một ấm, người kia nóng không chịu nổi, tự cởi chiếc áo dày ra.", "cau": [{"id": "NG1-1", "zh": "北风吹了两次以后，那个人就把衣服脱了。", "dung": false, "yt": "nghe hiểu ý · ★ 再次", "cs": "nam_bai", "giai": "Câu gốc: 风越大，那个人把衣服穿得越紧。北风再次用力，还是没有用 — gió thổi hai lần người kia vẫn không cởi, còn quấn chặt hơn."}, {"id": "NG1-2", "zh": "天气变暖和以后，那个人觉得太热了。", "dung": true, "yt": "nghe hiểu ý · ★ 受不了", "cs": "nam_bai", "giai": "Câu gốc: 天气越来越暖和，那个人热得受不了 — 热得受不了 = nóng không chịu nổi."}, {"id": "NG1-3", "zh": "这个故事说明，慢慢来的办法有时候比用力的办法更有用。", "dung": true, "yt": "suy luận", "cs": "nam_bai", "giai": "Bài không nói thẳng bài học. Gió thổi mạnh hai lần đều thất bại, Mặt Trời chỉ chiếu từ từ lại thắng → cách nhẹ nhàng, từ từ đôi khi hiệu quả hơn dùng sức."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe truyện, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "小王从来不做垃圾分类，总是把垃圾放在一起扔掉。妻子让他分一分，他说：“垃圾桶有的是，分不分有什么关系？”有一天，儿子回家说，老师讲了垃圾分类的知识，说什么也得做好分类。从那天起，儿子每天都把瓶子、纸和剩饭分开放。看到儿子这么认真，小王有点儿不好意思，也跟着儿子一起分了。", "dich": "Anh Vương xưa nay chẳng bao giờ phân loại rác, toàn gom rác vào một chỗ rồi vứt. Vợ bảo anh phân loại, anh nói: “Thùng rác thiếu gì, phân hay không thì có sao?” Một hôm, cậu con trai về nhà kể, cô giáo vừa giảng về cách phân loại rác, kiểu gì cũng phải phân loại cho đàng hoàng. Từ hôm đó, ngày nào cậu bé cũng để riêng chai lọ, giấy và cơm thừa. Thấy con nghiêm túc như vậy, anh Vương hơi ngại, cũng phân loại theo con.", "cau": [{"id": "NG2-1", "hoi": "小王开始的时候是怎么扔垃圾的？为什么？", "yt": "nghe chi tiết · ★ 有的是 (2 ý)", "cs": "nam_bai", "model": "他从来不分类，把所有垃圾放在一起扔掉，因为他觉得分不分没关系。", "more": ["他不分类，因为他觉得垃圾桶有的是。", "把垃圾放在一起扔，他觉得分类没什么关系。", "他从来不分类，觉得垃圾桶有的是，分不分都一样。", "他把所有垃圾都放在一起，因为他觉得不重要。", "没有分类，他觉得分不分没有关系。", "不做分类，因为他觉得没有用。"], "need": [["不分", "不做分类", "没有分类", "没分类", "放在一起"], ["有的是", "没关系", "没有关系", "没什么关系", "不重要", "没有用", "没用", "都一样"]], "giai": "Câu gốc: 小王从来不做垃圾分类，总是把垃圾放在一起扔掉……“垃圾桶有的是，分不分有什么关系？” — đủ 2 ý: không phân loại + vì cho rằng chẳng sao (thùng rác thiếu gì)."}, {"id": "NG2-2", "hoi": "这个故事告诉我们什么？", "yt": "suy luận · bài học", "cs": "nam_bai", "model": "保护环境要从小事做起，每个人都应该做好垃圾分类。", "more": ["垃圾分类很重要，大家都要做。", "环保要从小事做起。", "大人也可以向孩子学习。", "每个人都有保护环境的责任。", "垃圾分类每个人都应该做。", "要从自己做起，做好垃圾分类。"], "need": [["从小事", "每个人", "大家", "人人", "向孩子学习", "很重要", "责任", "从自己"]], "avoid": [["不用分类", "Ngược ý câu chuyện: cuối cùng anh Vương thấy ngại và cũng bắt đầu phân loại."], ["没有什么关系", "Đó là suy nghĩ SAI lúc đầu của anh Vương, không phải bài học."]], "giai": "Bài không nói thẳng bài học. Anh Vương coi việc phân loại là chuyện vặt; đứa con nhỏ làm nghiêm túc khiến anh ngại và làm theo. → 保护环境要从小事做起，每个人都有责任（大人也可以向孩子学习）。"}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "阿明的日记", "cau": ["去年寒假，我第一次去北京旅游。", "出发前，妈妈说北方冬天很冷，说什么也得多带几件厚衣服。", "我说：“没问题，我有的是很多厚衣服。”", "到了北京，我才发现那里的气温在零下十度左右。", "尽管我穿了三件衣服，所以还是冷得受不了。", "河内的冬天比较暖和，而北京的冬天又干又冷。", "不过，北京的雪景十分美丽，我拍了很多照片。", "今年冬天，我想再次去北京看雪。"], "loi": [{"i": 2, "id": "DC1-a", "yt": "有的是 (không thêm 很多)", "cs": "nam_bai", "model": "我说：“没问题，我有的是厚衣服。”", "more": ["没问题，我有的是厚衣服。", "我有的是厚衣服。", "我说：“没问题，厚衣服我有的是。”", "没问题，我有很多厚衣服。", "我说：“没问题，我有的是厚衣服！”"], "need": [["有的是厚衣服", "厚衣服我有的是", "有很多厚衣服"]], "avoid": [["有的是很多", "有的是 đã là “rất nhiều” — bỏ 很多: 我有的是厚衣服."]], "giai": "有的是 + N = có cả đống, thiếu gì: 我有的是厚衣服 · 厚衣服我有的是. Bản thân 有的是 đã mang nghĩa “rất nhiều”, không thêm 很多."}, {"i": 4, "id": "DC1-b", "yt": "ôn Bài 9 · 尽管……，但是……", "cs": "nam_bai", "bai_cu": 9, "model": "尽管我穿了三件衣服，但是还是冷得受不了。", "more": ["尽管我穿了三件衣服，可是还是冷得受不了。", "尽管我穿了三件衣服，但还是冷得受不了。", "尽管穿了三件衣服，但是我还是冷得受不了。", "我尽管穿了三件衣服，但是还是很冷。", "尽管我穿了三件衣服，可是我还是冷得受不了。"], "need": ["尽管", ["但", "可是"]], "avoid": [["所以", "Ôn Bài 9: 尽管 đi với 但是 / 可是 (chuyển ý), không đi với 所以."]], "order": [["尽管", "但", "尽管 ở vế trước, 但是 ở vế sau."]], "giai": "Ôn Bài 9: 尽管 + sự thật，但是 / 可是 + kết quả NGƯỢC mong đợi. Mặc 3 áo mà vẫn lạnh là ngược → 但是, không phải nhân–quả 所以."}], "dich": "Kỳ nghỉ đông năm ngoái, mình đi du lịch Bắc Kinh lần đầu. Trước khi đi, mẹ dặn mùa đông phương Bắc lạnh lắm, kiểu gì cũng phải mang thêm mấy cái áo dày. Mình bảo: “Không sao, áo dày con có cả đống.” Đến Bắc Kinh mình mới thấy nhiệt độ ở đó khoảng âm mười độ. Dù mặc ba lớp áo, mình vẫn lạnh không chịu nổi. Mùa đông Hà Nội khá ấm, còn mùa đông Bắc Kinh vừa khô vừa lạnh. Có điều, cảnh tuyết ở Bắc Kinh đẹp vô cùng, mình chụp rất nhiều ảnh. Mùa đông năm nay, mình muốn lại đến Bắc Kinh ngắm tuyết."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "饭馆的“光盘”活动", "van": "阿明在一家饭馆当服务员。以前，很多客人点了一大桌菜，吃不完就走，每天剩下的饭菜有的是。后来，饭馆开展了“光盘”活动：把饭菜吃完的客人可以得到一个小礼物；客人点得太多时，服务员会提醒他们。刚开始，有的客人不太高兴，觉得服务员管得太多，甚至引起了误会。但是慢慢地，大家都习惯了。现在，饭馆每个月能__节约__不少钱，还用这些钱帮助附近的老人。", "dich": "A Minh làm phục vụ ở một quán ăn. Trước đây, nhiều khách gọi đầy một bàn đồ ăn, ăn không hết thì bỏ về, đồ ăn thừa mỗi ngày nhiều vô kể. Sau đó, quán tổ chức hoạt động “ăn sạch đĩa”: khách ăn hết đồ ăn được tặng một món quà nhỏ; khách gọi nhiều quá thì phục vụ sẽ nhắc. Lúc đầu, có khách không vui lắm, cho rằng phục vụ quản nhiều quá, thậm chí còn gây ra hiểu lầm. Nhưng dần dần, mọi người đều quen. Giờ đây, mỗi tháng quán tiết kiệm được kha khá tiền, còn dùng số tiền đó giúp đỡ người già quanh đó.", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "饭馆为什么给把饭菜吃完的客人送小礼物？", "yt": "đọc · lý do (suy luận)", "cs": "nam_bai", "model": "为了让客人把饭菜吃完，不浪费。", "more": ["让客人不浪费饭菜。", "希望客人都能吃完，不剩下。", "因为饭馆不想浪费。", "好让客人少剩一些饭菜。", "让大家都“光盘”，节约饭菜。", "为了让客人点菜时别点太多，吃完再走。"], "need": [["浪费", "吃完", "光盘", "剩", "节约"]], "giai": "Bài không nói “因为……”. Suy ra từ tình hình trước đó: 很多客人……吃不完就走，每天剩下的饭菜有的是 → tặng quà để khuyến khích khách ăn hết, không lãng phí."}, {"id": "DC2-2", "kieu": "chon", "hoi": "刚开始，有的客人对服务员的提醒是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["不太高兴，觉得服务员管得太多", "很感动，觉得服务员很关心自己", "觉得没什么，马上就习惯了"], "dung": 0, "giai": "Câu: 刚开始，有的客人不太高兴，觉得服务员管得太多，甚至引起了误会 — lúc đầu khó chịu; “quen dần” là chuyện về SAU."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“节约”是什么意思？请用简单的中文解释。", "yt": "★ 节约 · giải thích từ", "cs": "nam_bai", "model": "“节约”就是少用、不浪费。", "more": ["不浪费钱。", "少花钱。", "把钱留下来，不乱花。", "能少用就少用。", "少用一些，不浪费。"], "need": [["不浪费", "少用", "少花", "不乱花", "留下"]], "giai": "节约 = dùng ít, không phung phí: 节约用水 · 节约资源 · 节约钱. Trái nghĩa với 浪费."}]}], "san_pham": {"loai": "noi", "de": "说说你家乡的气候：一年里天气有什么变化？跟别的地方比怎么样？在生活中，你是怎么保护环境的？", "de_vi": "Kể về khí hậu quê em: thời tiết trong năm thay đổi thế nào? So với nơi khác thì sao? Trong cuộc sống, em bảo vệ môi trường bằng cách nào?", "chu_toi_thieu": 200, "giay_toi_thieu": 90, "dan_y": [["① Khí hậu quê em", "你的家乡在哪儿？气候怎么样？夏天、冬天的气温是多少？（气候 · 气温 · 暖和）"], ["② So với nơi khác", "你去过气候很不一样的地方吗？感觉怎么样？（而 · 受不了 · 说什么也得 · 有的是）"], ["③ Bảo vệ môi trường", "你平时怎么保护环境？（节约 · 拒绝浪费 · 垃圾分类 · 绿色出行）"], ["④ Suy nghĩ", "你想对大家说什么？以后还想做什么？（再次 · 责任 · 从小事做起）"]], "tu_goi_y": ["气候", "气温", "暖和", "厚", "受不了", "后悔", "节约", "浪费", "拒绝", "环保", "垃圾", "分类"], "cau_truc": [["说什么 / 怎么也得", ["也得"]], ["有的是", ["有的是"]], ["而 (đối lập)", ["而"]], ["再次", ["再次"]]], "can_cau_truc": 2, "can_tu": 4, "bat_buoc": true, "mau": "我的家乡在河内。河内一年有四个季节，夏天很热，气温常常在三十五度以上，而冬天比较冷，有时候只有十度左右。前年冬天，我去哈尔滨出差，那里的气温低于零下二十度。我以为自己有的是厚衣服，没想到还是冷得受不了，真后悔没听朋友的话。从那以后我知道了，去北方说什么也得多穿点儿。在生活中，我也很注意保护环境。我出门尽量坐公交车或者骑自行车；在饭馆点菜不点太多，拒绝浪费；在家里我和家人一起做垃圾分类，节约用水用电。我觉得保护环境是每个人的责任，要从小事做起。明年，我想再次参加学校的“绿色生活”活动。", "mau_dich": "Quê mình ở Hà Nội. Hà Nội một năm có bốn mùa, mùa hè rất nóng, nhiệt độ thường trên ba mươi lăm độ, còn mùa đông khá lạnh, có lúc chỉ khoảng mười độ. Mùa đông năm kia, mình đi công tác Cáp Nhĩ Tân, nhiệt độ ở đó dưới âm hai mươi độ. Mình tưởng áo dày mình có cả đống, không ngờ vẫn lạnh không chịu nổi, thật hối hận vì không nghe lời bạn. Từ đó mình biết, lên phương Bắc kiểu gì cũng phải mặc nhiều vào. Trong cuộc sống, mình cũng rất chú ý bảo vệ môi trường. Ra ngoài mình cố gắng đi xe buýt hoặc xe đạp; đi ăn không gọi quá nhiều món, nói không với lãng phí; ở nhà mình cùng gia đình phân loại rác, tiết kiệm điện nước. Mình nghĩ bảo vệ môi trường là trách nhiệm của mỗi người, phải bắt đầu từ việc nhỏ. Năm sau, mình muốn lại tham gia hoạt động “Sống xanh” của trường.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng ít nhất 2 cấu trúc của bài (说什么也得 · 有的是 · 而 · 再次)", "Phát âm, thanh điệu người nghe hiểu", "Nói liền mạch, đủ ≈ 90 giây"]}, "audio": {}};
