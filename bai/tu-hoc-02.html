window.CHE_DO = 'tuhoc';
window.DU_LIEU = {"bai": 2, "tu_hoc": [{"id": "T1", "yt": "☆ 房租 · 房东", "kn": "đọc", "cs": "tu_hoc", "tinh": "Tiền thuê căn nhà này mỗi tháng 3000 tệ.", "cau": "这个房子的______每月三千块。", "pa": ["房东", "房租", "房间"], "dung": 1, "giai": "房租 = tiền thuê nhà. 房东 = chủ nhà (người) · 房间 = căn phòng."}, {"id": "T2", "yt": "☆ 出租 (bẫy 租)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Chủ nhà đăng tin: phòng này CHO THUÊ, mỗi tháng 2000 tệ.", "cau": "这个房间______，每月两千元。", "pa": ["出租", "租房", "房东"], "dung": 0, "giai": "出租 = CHO thuê (chủ nhà nói). 租 / 租房 = ĐI thuê (người thuê nói): 我想租房."}, {"id": "T3", "yt": "☆ 台", "kn": "đọc", "cs": "tu_hoc", "tinh": "Phòng khách có một cái tivi to.", "cau": "客厅里有一______大电视。", "pa": ["张", "台", "条"], "dung": 1, "giai": "台 cho máy móc: 一台电视 · 一台空调 · 一台电脑. 张 cho mặt phẳng (一张床) · 条 cho vật dài mềm (一条毛巾)."}, {"id": "T4", "yt": "☆ 价格 (bẫy 贵)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Giá căn nhà này cao quá.", "cau": "这个房子的价格太______了。", "pa": ["贵", "高", "多"], "dung": 1, "giai": "价格 / 工资 đi với 高 / 低. Còn 东西 / 房子 thì 贵 / 便宜: 这个房子太贵了."}, {"id": "T5", "yt": "☆ 查找 · 查看", "kn": "đọc", "cs": "tu_hoc", "tinh": "Tôi TÌM căn nhà phù hợp trên mạng.", "cau": "我在网上______合适的房子。", "pa": ["查看", "查找", "检查"], "dung": 1, "giai": "查找 = tìm (thứ chưa thấy). 查看 = xem xét thông tin đã có · 检查 = kiểm tra (sức khoẻ, bài tập)."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe đoạn văn, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "我叫王明，上个月大学毕业，在一家公司找到了工作。由于公司离学校比较远，我决定在公司附近租一个房子。我先在网上查找出租信息，接着又去看了三个房子。最后我租了一个离地铁站很近的房间，房租每月两千五百元。房间不大，不过很亮，也收拾得很干净。周围有超市和饭馆，生活很方便。只是楼下的饭馆晚上很热闹，恐怕会影响我休息。", "dich": "Tôi là Vương Minh, tháng trước tốt nghiệp đại học và tìm được việc ở một công ty. Vì công ty khá xa trường nên tôi quyết định thuê nhà gần công ty. Tôi tìm tin cho thuê trên mạng trước, sau đó đi xem ba căn. Cuối cùng tôi thuê một phòng rất gần ga tàu điện ngầm, tiền thuê 2500 tệ mỗi tháng. Phòng không to nhưng sáng sủa, dọn dẹp cũng rất sạch. Xung quanh có siêu thị và quán ăn, sinh hoạt rất tiện. Chỉ có điều quán ăn dưới nhà buổi tối rất náo nhiệt, e là sẽ ảnh hưởng đến việc nghỉ ngơi của tôi.", "cau": [{"id": "NG1-1", "zh": "王明是在网上查找出租信息的。", "dung": true, "yt": "nghe chi tiết · 查找", "cs": "nam_bai", "giai": "Câu gốc: 我先在网上查找出租信息，接着又去看了三个房子。"}, {"id": "NG1-2", "zh": "王明租的房间离地铁站很远。", "dung": false, "yt": "nghe chi tiết", "cs": "nam_bai", "giai": "Câu gốc: 离地铁站很近的房间 — rất GẦN ga tàu điện ngầm."}, {"id": "NG1-3", "zh": "王明的房间很大，不过不太干净。", "dung": false, "yt": "nghe chi tiết · 不过", "cs": "nam_bai", "giai": "Câu gốc: 房间不大，不过很亮，也收拾得很干净 — phòng KHÔNG to, nhưng sáng và sạch."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe đoạn văn, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "你好，我是房东，姓张。这个房子有两个房间，大的那间出租，房租每月三千元。客厅里有沙发和一台电视，厨房里有冰箱，你都可以用。房间里有床、书桌和空调，不过毛巾这些东西你得自己买。小区周围很安静，离公园也很近，你平常可以去那儿跑步。你今天先回去想想，如果决定租了，给我打个电话就是了。", "dich": "Chào cháu, cô là chủ nhà, họ Trương. Căn nhà này có hai phòng, phòng lớn cho thuê, tiền thuê 3000 tệ mỗi tháng. Phòng khách có sofa và một cái tivi, nhà bếp có tủ lạnh, cháu dùng thoải mái. Trong phòng có giường, bàn học và điều hoà, có điều khăn mặt những thứ đó thì cháu phải tự mua. Xung quanh khu này rất yên tĩnh, lại gần công viên, ngày thường cháu có thể ra đó chạy bộ. Hôm nay cháu cứ về suy nghĩ đã, nếu quyết định thuê thì gọi điện cho cô là được.", "cau": [{"id": "NG2-1", "hoi": "租这个房间，什么东西要自己买？", "yt": "nghe chi tiết · 不过", "cs": "nam_bai", "model": "毛巾这些东西要自己买。", "more": ["毛巾。", "要自己买毛巾。", "得自己买毛巾。", "他要买几条毛巾。", "毛巾要自己买。"], "need": ["毛巾"], "giai": "Câu gốc: 房间里有床、书桌和空调，不过毛巾这些东西你得自己买 — 不过 báo điều chưa có."}, {"id": "NG2-2", "hoi": "如果决定租这个房子，应该怎么做？", "yt": "nghe chi tiết · 就是了", "cs": "nam_bai", "model": "给房东打个电话就是了。", "more": ["给房东打电话。", "给张阿姨打电话。", "打电话告诉房东。", "给她打个电话就可以了。", "打个电话就是了。"], "need": [["电话", "告诉房东", "告诉她"]], "avoid": [["跑步", "Chạy bộ là gợi ý về công viên, không phải việc cần làm khi quyết định thuê."]], "giai": "Câu gốc: 如果决定租了，给我打个电话就是了 — × 就是了 = “cứ … là được”."}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "林小雨的日记", "cau": ["今天我终于搬进了新家。", "这次租房子不并容易，我看了五个房子才找到合适的。", "新家离公司很近，走路十分钟就到了。", "房间虽然不大，不过收拾得很干净。", "房东是一位五十多岁的阿姨，人很热情。", "她带我看了客厅和厨房，并告诉我空调怎么用。", "她还说：“有什么问题，就是了给我打电话。”", "由于周围住着很多年轻人，所以这里晚上有点儿热闹。", "不过我觉得没关系，我也喜欢热闹。"], "loi": [{"i": 1, "id": "DC1-a", "yt": "NP3 并不", "cs": "nam_bai", "model": "这次租房子并不容易，我看了五个房子才找到合适的。", "more": ["这次租房子并不容易。", "租房子并不容易，我看了五个房子才找到合适的。", "这次租房并不容易，我看了五个房子才找到。", "这次租房子并不容易，我看了五个才找到合适的。", "这次找房子并不容易。"], "need": ["并不容易"], "avoid": [["不并", "并 đứng TRƯỚC 不 / 没: 并不容易."]], "giai": "并 + 不 / 没 = “hoàn toàn không như người ta tưởng”: 租房子并不容易. Không nói 不并."}, {"i": 6, "id": "DC1-b", "yt": "NP1 × 就是了", "cs": "nam_bai", "model": "她还说：“有什么问题，给我打电话就是了。”", "more": ["有什么问题，给我打电话就是了。", "有什么问题给我打电话就是了。", "有问题，给我打电话就是了。", "有什么问题，打电话给我就是了。", "有什么问题你给我打电话就是了。"], "need": ["就是了", "电话"], "avoid": [["就是了给", "× 就是了 đứng CUỐI câu: 给我打电话就是了."]], "order": [["电话", "就是了", "就是了 phải đứng cuối câu, sau 给我打电话."]], "giai": "V + 就是了 = “cứ … là được”, đứng CUỐI câu: 给我打电话就是了."}], "dich": "Hôm nay cuối cùng mình đã dọn vào nhà mới. Lần thuê nhà này chẳng dễ chút nào, mình xem năm căn mới tìm được căn vừa ý. Nhà mới gần công ty, đi bộ mười phút là tới. Phòng tuy không to nhưng dọn dẹp rất sạch. Chủ nhà là một cô ngoài năm mươi, rất nhiệt tình. Cô dẫn mình xem phòng khách và nhà bếp, rồi chỉ cho mình cách dùng điều hoà. Cô còn nói: “Có vấn đề gì cứ gọi điện cho cô là được.” Vì xung quanh có nhiều người trẻ sống nên buổi tối ở đây hơi náo nhiệt. Nhưng mình thấy không sao, mình cũng thích náo nhiệt."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "刘阳为什么租房", "van": "刘阳今年二十八岁，在北京工作了五年。他的父母一直希望他买房，因为他们觉得有房才有家。可是刘阳觉得，现在买房并不是最好的选择。一方面，北京的房子价格太高，他的工资还不够；另一方面，他以后可能会去别的城市工作。所以他在公司__周围__租了一个小房子，每天走路上班，又方便又便宜。他说：“租房也很好，等以后钱多了，我再考虑买房。”", "dich": "Lưu Dương năm nay 28 tuổi, đã làm việc ở Bắc Kinh năm năm. Bố mẹ anh luôn mong anh mua nhà, vì họ cho rằng có nhà mới có tổ ấm. Nhưng Lưu Dương thấy bây giờ mua nhà hoàn toàn không phải lựa chọn tốt nhất. Một mặt, giá nhà ở Bắc Kinh quá cao, lương của anh vẫn chưa đủ; mặt khác, sau này anh có thể sẽ đi làm ở thành phố khác. Vì vậy anh thuê một căn nhỏ ở gần công ty, ngày nào cũng đi bộ đi làm, vừa tiện vừa rẻ. Anh nói: “Thuê nhà cũng tốt lắm, đợi sau này nhiều tiền hơn tôi sẽ tính chuyện mua nhà.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "刘阳为什么现在不买房？（说出一个原因就可以）", "yt": "đọc · lý do", "cs": "nam_bai", "model": "因为北京的房子价格太高，他的工资还不够。", "more": ["房子价格太高。", "因为他的工资还不够。", "北京的房子太贵了。", "他以后可能会去别的城市工作。", "因为他的钱不够。"], "need": [["价格", "贵", "工资", "钱", "别的城市"]], "avoid": [["有房才有家", "Đó là suy nghĩ của BỐ MẸ anh ấy, không phải lý do anh không mua nhà."]], "giai": "Hai lý do sau 一方面……另一方面……: giá nhà quá cao, lương chưa đủ · sau này có thể đi làm ở thành phố khác."}, {"id": "DC2-2", "kieu": "chon", "hoi": "刘阳对租房是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["觉得租房也很好，以后再考虑买房", "觉得租房不好，很想马上买房", "觉得父母说得对，应该早点儿买房"], "dung": 0, "giai": "Câu cuối: 租房也很好，等以后钱多了，我再考虑买房 — hài lòng với việc thuê, mua nhà để sau."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“周围”是什么意思？请用简单的中文解释。", "yt": "★ 周围 · giải thích từ", "cs": "nam_bai", "model": "“周围”就是“附近”的意思。", "more": ["附近。", "旁边。", "就是公司附近。", "离公司很近的地方。", "公司旁边的地方。"], "need": [["附近", "旁边", "很近"]], "giai": "周围 = 附近 · 四边: N + 周围 — 公司周围 = những chỗ quanh công ty."}]}], "san_pham": {"loai": "noi", "de": "说说你现在住的地方：房子怎么样？周围的环境怎么样？你满意吗？", "de_vi": "Kể về chỗ em đang ở: nhà thế nào? Môi trường xung quanh ra sao? Em có hài lòng không?", "chu_toi_thieu": 200, "giay_toi_thieu": 90, "dan_y": [["① Mở đầu", "你住在哪儿？房子是租的还是自己家的？住了多长时间了？"], ["② Trong nhà", "房子里有什么？（客厅 · 厨房 · 房间 · 一台……）你平常在家做什么？"], ["③ Xung quanh", "周围的环境怎么样？好的地方……，不过……（热闹 · 恐怕……）"], ["④ Kết", "你满意吗？如果再找房子，你理想的房子是什么样的？（由于……，所以……）"]], "tu_goi_y": ["租", "房租", "房东", "收拾", "周围", "热闹", "客厅", "厨房", "位置", "价格", "理想", "平常"], "cau_truc": [["……，不过……", ["不过"]], ["由于……，所以……", ["由于"]], ["并 / 并不……", ["并"]], ["× 就是了", ["就是了"]]], "can_cau_truc": 2, "can_tu": 4, "mau": "我现在住在河内，房子是租的，已经住了两年了。房子不大，有两个房间、一个客厅和一个厨房。客厅里有沙发和一台电视，我平常下班以后喜欢在那儿看电视。房租每月五百万越南盾，价格不算太高。房东是一位阿姨，人很热情，房子有什么问题，告诉她就是了。周围的环境也不错，附近有超市、饭馆和公园，生活很方便，不过晚上楼下有点儿热闹，有时候会影响我休息。由于房子离公司比较远，所以我每天要花一个小时上班。如果再找房子，我理想的房子要离公司近一点儿，周围安静一点儿，价格也要合适。", "mau_dich": "Mình đang sống ở Hà Nội, nhà đi thuê, đã ở được hai năm. Nhà không to, có hai phòng ngủ, một phòng khách và một bếp. Phòng khách có sofa và một cái tivi, ngày thường đi làm về mình thích xem tivi ở đó. Tiền thuê năm triệu đồng một tháng, giá không quá cao. Chủ nhà là một cô rất nhiệt tình, nhà có vấn đề gì cứ báo cô là được. Môi trường xung quanh cũng tốt, gần đó có siêu thị, quán ăn và công viên, sinh hoạt rất tiện, có điều buổi tối dưới nhà hơi ồn ào náo nhiệt, đôi khi ảnh hưởng đến việc nghỉ ngơi. Vì nhà khá xa công ty nên ngày nào mình cũng mất một tiếng đi làm. Nếu tìm nhà lần nữa, căn nhà lý tưởng của mình phải gần công ty hơn, xung quanh yên tĩnh hơn, giá cũng phải hợp lý.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài (不过 · 由于 · 并 · 就是了)", "Phát âm, thanh điệu người nghe hiểu", "Nói liền mạch, đủ ≈ 90 giây"]}, "audio": {}};
