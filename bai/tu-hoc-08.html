window.DU_LIEU = {"bai": 8, "tu_hoc": [{"id": "T1", "yt": "☆ 加班", "kn": "đọc", "cs": "tu_hoc", "tinh": "Việc nhiều quá, chín giờ tối anh ấy vẫn còn ở công ty TĂNG CA.", "cau": "工作太多了，他晚上九点还在公司______。", "pa": ["加班", "下班", "放假"], "dung": 0, "giai": "加班 = tăng ca, làm thêm giờ. 下班 = tan làm (đã về rồi thì không “还在公司”) · 放假 = được nghỉ lễ."}, {"id": "T2", "yt": "☆ 效率 (kết hợp 高 / 低)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Thức khuya xong, hôm sau làm việc thường kém hiệu quả.", "cau": "熬夜以后，第二天的工作______往往很低。", "pa": ["态度", "效率", "习惯"], "dung": 1, "giai": "效率 đi với 高 / 低: 工作效率很低. 态度 đi với 好 / 认真 · 习惯 đi với 好 / 坏 — không nói 态度很低, 习惯很低."}, {"id": "T3", "yt": "☆ 帽子 (bẫy 戴 / 穿)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Ngoài trời nắng to, ra ngoài nhớ ĐỘI MŨ.", "cau": "外面太阳很大，出门记得戴______。", "pa": ["衣服", "鞋", "帽子"], "dung": 2, "giai": "戴 + 帽子 / 眼镜 / 手表 (đồ đội, đeo). Quần áo, giày dép dùng 穿: 穿衣服 · 穿鞋 — không nói 戴衣服, 戴鞋."}, {"id": "T4", "yt": "☆ 景点 (bẫy 风景 / 景色)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Trường Thành, Cố Cung đều là những ĐIỂM THAM QUAN nổi tiếng ở Bắc Kinh.", "cau": "长城、故宫都是北京有名的旅游______，每天都有很多人去参观。", "pa": ["景点", "风景", "景色"], "dung": 0, "giai": "景点 = một NƠI để tham quan: 旅游景点 · 参观景点. 风景 / 景色 = cảnh vật nhìn thấy (风景很美), không phải một địa điểm, không nói 旅游风景."}, {"id": "T5", "yt": "☆ 交通 (bẫy Hán–Việt 交流)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Chỗ này đi lại rất tiện, đi tàu điện ngầm mười phút là tới nội thành.", "cau": "这儿的______很方便，坐地铁十分钟就到市区。", "pa": ["交流", "通知", "交通"], "dung": 2, "giai": "交通 = giao thông, đi lại: 交通很方便. 交流 = giao lưu, trao đổi (KHÔNG phải “giao thông”) · 通知 = thông báo."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe truyện, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "从前，有位老人的马跑丢了。大家觉得很可惜，老人却说：“这不一定是坏事。”几个月之后，马回来了，还带回来一些好马。邻居们十分羡慕，老人却说：“这也不一定是好事。”后来，他儿子骑新马时从马上掉下来，腿受伤了。不管遇到好事还是坏事，老人都很冷静。", "dich": "Ngày xưa, có một ông lão bị sổng mất con ngựa. Ai cũng thấy tiếc, ông lão lại bảo: “Chưa chắc đã là chuyện xấu.” Mấy tháng sau, con ngựa quay về, còn dẫn theo mấy con ngựa tốt. Hàng xóm ai nấy đều thèm thuồng, ông lão lại bảo: “Chuyện này cũng chưa chắc đã là chuyện tốt.” Về sau, con trai ông cưỡi ngựa mới thì ngã ngựa, bị thương ở chân. Dù gặp chuyện tốt hay chuyện xấu, ông lão vẫn rất điềm tĩnh.", "cau": [{"id": "NG1-1", "zh": "马丢了以后，老人并不觉得难过。", "dung": true, "yt": "nghe hiểu ý · 并不 (Bài 2)", "cs": "nam_bai", "giai": "Câu gốc: 大家觉得很可惜，老人却说：“这不一定是坏事。” — mọi người tiếc, ông lão thì không buồn."}, {"id": "NG1-2", "zh": "马带着好马回来以后，老人认为这肯定是一件好事。", "dung": false, "yt": "nghe hiểu ý · 不一定", "cs": "nam_bai", "giai": "Câu gốc: 邻居们十分羡慕，老人却说：“这也不一定是好事。” — ông lão nói CHƯA CHẮC là chuyện tốt."}, {"id": "NG1-3", "zh": "儿子受伤这件事，跟马带回来的新马有关系。", "dung": true, "yt": "suy luận", "cs": "nam_bai", "giai": "Phải nối hai chi tiết: 马……带回来一些好马 · 他儿子骑新马时从马上掉下来 — con trai ngã chính từ con ngựa mới mà ngựa cũ dẫn về."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe truyện, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "张东和方青下个月都要考试。张东每天熬夜复习，常常学到夜里两点；方青每天十一点就睡觉，周末还去跑跑步。考试前一个星期，因为休息不够，张东上课时总想睡觉，学习效率下降了很多。考试结果出来了，跟张东相比，方青的成绩高多了。从那以后，张东每天晚上都早早地上床睡觉。", "dich": "Trương Đông và Phương Thanh tháng sau đều phải thi. Ngày nào Trương Đông cũng thức khuya ôn bài, thường học tới hai giờ đêm; còn Phương Thanh tối nào mười một giờ cũng đi ngủ, cuối tuần còn đi chạy bộ. Một tuần trước kỳ thi, vì nghỉ ngơi không đủ, Trương Đông lên lớp lúc nào cũng buồn ngủ, học kém hiệu quả hẳn đi. Có kết quả thi, so với Trương Đông, điểm của Phương Thanh cao hơn nhiều. Từ đó trở đi, tối nào Trương Đông cũng lên giường đi ngủ sớm.", "cau": [{"id": "NG2-1", "hoi": "考试前一个星期，张东上课时怎么样？为什么？", "yt": "nghe chi tiết · hiện tượng + nguyên nhân (2 ý)", "cs": "nam_bai", "model": "他上课时总想睡觉，学习效率下降了，因为他休息不够。", "more": ["总想睡觉，因为他每天熬夜复习。", "他很想睡觉，因为休息不够。", "他上课的时候老想睡觉，因为常常学到夜里两点。", "他学习效率下降了很多，因为每天熬夜，休息不够。", "上课时总想睡觉，因为他睡得太晚了。", "因为休息不够，他上课总想睡觉。"], "need": [["睡觉", "想睡", "效率"], ["休息不够", "熬夜", "两点", "睡得太晚", "睡得晚", "睡得太少", "睡得少", "没休息好", "休息得不够", "学到很晚", "没睡好"]], "avoid": [["效率提高", "Ngược rồi: 学习效率下降了很多 — hiệu quả học GIẢM."], ["效率高了", "Ngược rồi: 学习效率下降了很多 — hiệu quả học GIẢM."]], "giai": "Câu gốc: 因为休息不够，张东上课时总想睡觉，学习效率下降了很多 — đủ 2 ý: lên lớp buồn ngủ (hiệu quả giảm) + vì thức khuya, nghỉ không đủ."}, {"id": "NG2-2", "hoi": "这个故事告诉我们什么？", "yt": "suy luận · bài học", "cs": "nam_bai", "model": "学习要努力，也要休息好。", "more": ["学习的时候也要注意休息。", "不要熬夜复习，要早点儿睡觉。", "休息好了，学习效率才高。", "只努力不休息，成绩不一定好。", "考试前也要休息好，否则会越学越累。", "要安排好学习和休息的时间。"], "need": [["休息", "睡觉", "早点儿睡", "不要熬夜", "别熬夜", "不能熬夜", "少熬夜"]], "giai": "Bài không nói thẳng bài học. So hai bạn: Trương Đông thức khuya → buồn ngủ, điểm thấp hơn; Phương Thanh ngủ đủ, có vận động → điểm cao hơn; sau đó Trương Đông đi ngủ sớm. → 学习要努力，也要休息好。"}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "阮秋的日记", "cau": ["这个月公司的项目特别多，我几乎每天都加班。", "周五晚上，同事说：“你太累了，周末一定要放松放松，否则身体会受不了。”", "我们决定去郊区爬山。", "听说明天可能下雨，可是大家说：“不管明天下雨，我们都要去。”", "第二天早上，我戴上帽子，和同事们乘坐公交车出发了。", "郊区有山有水，景色十分美丽。", "同事说：“既然来了，所以我们多玩一会儿吧。”", "回家以后，我发现心情愉快多了。"], "loi": [{"i": 3, "id": "DC1-a", "yt": "NP1 不管……，都……", "cs": "nam_bai", "model": "听说明天可能下雨，可是大家说：“不管明天下不下雨，我们都要去。”", "more": ["不管明天下不下雨，我们都要去。", "可是大家说：“不管明天会不会下雨，我们都要去。”", "不管明天天气怎么样，我们都要去。", "不管明天下雨不下雨，我们也要去。", "听说明天可能下雨，可是大家说：“即使明天下雨，我们也要去。”", "不管雨多大，我们都要去。"], "need": [["下不下雨", "下雨不下雨", "会不会下雨", "是不是下雨", "雨多大", "雨大不大", "天气怎么样", "天气好不好", "即使"], ["都", "也"]], "giai": "Sau 不管 phải là một “lựa chọn”: 不管下不下雨 / 不管雨多大 / 不管天气怎么样. Không nói 不管下雨 (dịch từng chữ “dù trời mưa”). Muốn giữ nguyên “下雨” thì dùng 即使明天下雨，我们也要去."}, {"i": 6, "id": "DC1-b", "yt": "ôn Bài 7 · 既然……，就……", "cs": "nam_bai", "bai_cu": 7, "model": "同事说：“既然来了，我们就多玩一会儿吧。”", "more": ["既然来了，我们就多玩一会儿吧。", "同事说：“既然来了，就多玩一会儿吧。”", "既然来了，就多玩一会儿。", "既然已经来了，我们就多玩一会儿吧。", "同事说：“既然来了，我们就在这儿多玩一会儿吧。”"], "need": ["既然", "就"], "avoid": [["所以", "既然 đi với 就, không đi với 所以: 既然来了，我们就多玩一会儿吧."], ["就我们", "就 đứng SAU chủ ngữ: 我们就多玩一会儿."]], "order": [["既然", "就", "既然 ở vế trước, 就 ở vế sau."]], "giai": "Ôn Bài 7: 既然 + sự thật đã rõ，(chủ ngữ) + 就 + đề nghị. 既然 đi với 就, không đi với 所以."}], "dich": "Tháng này công ty nhiều dự án quá, gần như ngày nào mình cũng tăng ca. Tối thứ Sáu, đồng nghiệp bảo: “Cậu mệt quá rồi, cuối tuần nhất định phải xả hơi đi, không thì cơ thể chịu không nổi đâu.” Bọn mình quyết định ra ngoại ô leo núi. Nghe nói mai có thể mưa, nhưng mọi người bảo: “Mai mưa hay không thì bọn mình vẫn đi.” Sáng hôm sau, mình đội mũ rồi cùng đồng nghiệp bắt xe buýt xuất phát. Ngoại ô có núi có sông, cảnh đẹp vô cùng. Đồng nghiệp bảo: “Đã đến rồi thì mình chơi thêm lúc nữa đi.” Về đến nhà, mình thấy tâm trạng vui hơn hẳn."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "范清学会了放松", "van": "范清在一家公司工作。去年公司接了一个大项目，他每天加班到很晚，周末也不休息。由于休息不够，几个月之后，他常常感冒，工作效率也__下降__了很多，一个小时能做完的事，常常要做两三个小时。医生提醒他：“再这样下去，你会失去健康的。”后来，他每天按时下班，周末和家人去郊区走走。现在他说：“跟以前相比，我工作的时间少了，可是做得更快更好了。”", "dich": "Phạm Thanh làm việc ở một công ty. Năm ngoái công ty nhận một dự án lớn, ngày nào anh cũng tăng ca tới khuya, cuối tuần cũng không nghỉ. Vì nghỉ ngơi không đủ, mấy tháng sau anh hay bị cảm, hiệu suất làm việc cũng giảm hẳn, việc một tiếng làm xong thì thường phải làm mất hai ba tiếng. Bác sĩ nhắc anh: “Cứ thế này mãi, anh sẽ mất sức khoẻ đấy.” Sau đó, ngày nào anh cũng tan làm đúng giờ, cuối tuần cùng gia đình ra ngoại ô đi dạo. Giờ anh bảo: “So với trước đây, thời gian làm việc của tôi ít đi, nhưng làm lại nhanh hơn, tốt hơn.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "范清现在工作的时间少了，为什么却做得更快更好了？", "yt": "đọc · lý do (suy luận)", "cs": "nam_bai", "model": "因为他休息好了，工作效率提高了。", "more": ["他休息得好，效率高了。", "因为他每天按时下班，周末也放松，休息够了。", "休息好了，工作效率就高了。", "因为他学会了放松。", "他身体好了，心情也好了，所以做得更快。", "因为他不再加班到很晚，休息够了。"], "need": [["休息", "放松", "效率高", "效率提高", "身体好", "心情好"]], "avoid": [["效率下降", "Ngược rồi: bây giờ hiệu quả TĂNG, “下降” là lúc trước."], ["休息不够", "Đó là nguyên nhân lúc TRƯỚC làm chậm, không phải lý do bây giờ làm nhanh."]], "giai": "Bài không nói thẳng. So trước và sau: trước tăng ca, không nghỉ → hay ốm, hiệu suất giảm; sau tan làm đúng giờ, cuối tuần thư giãn → nghỉ đủ nên làm nhanh và tốt hơn."}, {"id": "DC2-2", "kieu": "chon", "hoi": "范清对现在的工作方式是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["很满意，觉得做得更快更好了", "不满意，觉得工作的时间太少了", "很担心，怕自己会失去健康"], "dung": 0, "giai": "Câu cuối: 跟以前相比，我工作的时间少了，可是做得更快更好了 — anh rất hài lòng."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“下降”是什么意思？请用简单的中文解释。", "yt": "★ 下降 · giải thích từ", "cs": "nam_bai", "model": "“下降”就是变低了、变差了的意思。", "more": ["变低了。", "效率比以前低了。", "没有以前高了。", "工作效率越来越差。", "做事比以前慢了。", "变少了。"], "need": [["低", "差", "慢", "少了", "变少", "减少", "不如以前", "没有以前"]], "avoid": [["不低", "Ngược nghĩa: 下降 là đi XUỐNG, thấp đi."], ["没有以前低", "Ngược nghĩa: 下降 là thấp hơn trước, không phải “không thấp bằng trước”."]], "giai": "下降 = 变低、变差: 工作效率下降了很多 → 一个小时能做完的事，常常要做两三个小时 (làm chậm hơn trước)."}]}], "san_pham": {"loai": "noi", "de": "说说你平时怎么放松：工作或者学习紧张的时候，你一般做什么？你是怎么安排工作、学习和休息的？", "de_vi": "Kể về cách em thư giãn: lúc công việc hay việc học căng thẳng, em thường làm gì? Em sắp xếp công việc, việc học và nghỉ ngơi thế nào?", "chu_toi_thieu": 200, "giay_toi_thieu": 90, "dan_y": [["① Mở đầu", "你最近忙不忙？工作或者学习紧张吗？（十分 · 加班 · 熬夜 · 效率下降）"], ["② Cách thư giãn", "你一般怎么放松？去哪儿？（不管……，都…… · 有A有B · 郊区 · 风景）"], ["③ Thay đổi", "放松以后有什么变化？（跟……相比 · 之后 · 心情 · 效率）"], ["④ Lời khuyên", "你想提醒朋友什么？（……，否则…… · 值得 · 失去 · 实际上）"]], "tu_goi_y": ["紧张", "放松", "值得", "失去", "之后", "提醒", "下降", "十分", "实际上", "主意", "效率", "郊区"], "cau_truc": [["不管……，都 / 也……", ["不管"]], ["……，否则……", ["否则"]], ["跟 / 与……相比", ["相比"]], ["有 A 有 B", ["有山有水"]]], "can_cau_truc": 2, "can_tu": 4, "bat_buoc": true, "mau": "我在河内一家公司工作，最近公司的项目特别多，我常常加班到很晚，工作十分紧张。有一段时间，我晚上睡不好，工作效率也下降了。后来，朋友提醒我：“该放松的时候就要放松，否则失去了健康就不值得了。”现在，不管工作多忙，我周末都会好好休息。有时候我和朋友去郊区爬山，那里有山有水，景色很美；有时候我去西湖边走走，看看眼前的风景；有时候就在家里安安静静地看看书。跟以前相比，我的心情愉快多了，工作也做得更快更好。实际上，休息好了，才能工作好。所以我觉得，学会放松也是一种能力。", "mau_dich": "Mình làm ở một công ty tại Hà Nội, dạo này công ty nhiều dự án lắm, mình hay tăng ca tới khuya, công việc căng thẳng vô cùng. Có một dạo mình ngủ không ngon, làm việc cũng kém hiệu quả hẳn. Sau đó bạn mình nhắc: “Lúc cần xả hơi thì phải xả hơi, không thì mất sức khoẻ thì chẳng đáng đâu.” Giờ thì dù bận cỡ nào, cuối tuần mình cũng nghỉ ngơi cho tử tế. Có hôm mình với bạn ra ngoại ô leo núi, ở đó có núi có sông, cảnh đẹp lắm; có hôm mình ra Hồ Tây đi dạo, ngắm cảnh trước mắt; có hôm thì chỉ ở nhà yên tĩnh đọc sách. So với trước đây, tâm trạng mình vui hơn nhiều, làm việc cũng nhanh hơn, tốt hơn. Thật ra có nghỉ ngơi đủ thì mới làm việc tốt được. Nên mình thấy biết cách thư giãn cũng là một kỹ năng.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài (不管……都 · 否则 · 跟……相比 · 有A有B)", "Phát âm, thanh điệu người nghe hiểu", "Nói liền mạch, đủ ≈ 90 giây"]}, "audio": {}};
