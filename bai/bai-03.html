window.DU_LIEU = {"bai": 3, "tu_hoc": [{"id": "T1", "yt": "☆ 寄 (bẫy “gửi”)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Sách nặng quá, mình gửi chuyển phát cho bạn nhé.", "cau": "书太重了，我用快递______给你吧。", "pa": ["发", "寄", "带"], "dung": 1, "giai": "寄 = gửi qua bưu điện / chuyển phát (寄快递 · 寄东西). 发 = gửi tin nhắn, email (发信息) · 带 = mang theo người."}, {"id": "T2", "yt": "☆ 手段 (bẫy Hán–Việt)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Nhiều nước dùng BIỆN PHÁP kỹ thuật để bảo vệ thông tin cá nhân.", "cau": "很多国家通过技术______来保护个人信息。", "pa": ["手段", "手指", "手续"], "dung": 0, "giai": "⚠ 手段 đọc Hán–Việt là “thủ đoạn” nhưng ở đây là BIỆN PHÁP, trung tính: 技术手段 · 法律手段. 手指 = ngón tay · 手续 = thủ tục."}, {"id": "T3", "yt": "☆ 购物 (không mang tân ngữ)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Cuối tuần mình thích ra trung tâm thương mại MUA quần áo.", "cau": "周末我喜欢去商场______衣服。", "pa": ["购物", "买", "网购"], "dung": 1, "giai": "购物 = mua sắm, KHÔNG mang tân ngữ: 去商场购物. Có đồ vật cụ thể → 买: 买衣服. 网购 = mua online."}, {"id": "T4", "yt": "☆ 结账 (bẫy “thanh toán”)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Ăn xong, gọi phục vụ: “Em ơi, tính tiền!”", "cau": "服务员，我们吃好了，______！", "pa": ["支付", "购物", "结账"], "dung": 2, "giai": "结账 = tính tiền, thanh toán hoá đơn (nhà hàng, siêu thị). 支付 trang trọng, đi với cách trả: 用手机支付 · 购物 = mua sắm."}, {"id": "T5", "yt": "☆ 密码 (bẫy 号码)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Mình quên MẬT KHẨU nên không mở được app.", "cau": "我忘了______，打不开这个软件了。", "pa": ["号码", "密码", "网络"], "dung": 1, "giai": "密码 = mật khẩu (银行卡密码). 号码 = số (电话号码) · 网络 = mạng internet."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe truyện, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "市场上有个人卖手机，他大声说：“我的手机不仅好看，还特别结实，甚至从楼上掉下去也不会坏！”过了一会儿，他又拿出一些手机包，说：“没有这个包保护，手机一掉在地上就坏了。”一位老人笑着问：“手机从楼上掉下去都不会坏，为什么还要买包呢？”卖手机的人一句话也说不出来。卖东西要说真话。", "dich": "Ở chợ có một người bán điện thoại, anh ta rao to: “Điện thoại của tôi không chỉ đẹp mà còn cực kỳ bền, thậm chí rơi từ trên lầu xuống cũng không hỏng!” Một lúc sau, anh ta lại lấy ra mấy cái bao điện thoại, nói: “Không có bao này bảo vệ thì điện thoại rơi xuống đất là hỏng ngay.” Một ông cụ cười hỏi: “Điện thoại rơi từ trên lầu xuống còn không hỏng, thế mua bao làm gì nữa?” Người bán điện thoại cứng họng, không nói được câu nào. Bán hàng thì phải nói thật.", "cau": [{"id": "NG1-1", "zh": "卖手机的人说，他的手机很好看，也很结实。", "dung": true, "yt": "nghe chi tiết · 不仅……还", "cs": "nam_bai", "giai": "Câu gốc: 我的手机不仅好看，还特别结实 — 不仅 A，还 B: vừa đẹp vừa bền."}, {"id": "NG1-2", "zh": "卖手机的人说，没有手机包，手机掉在地上也不会坏。", "dung": false, "yt": "nghe chi tiết · ★ 保护", "cs": "nam_bai", "giai": "Câu gốc: 没有这个包保护，手机一掉在地上就坏了 — KHÔNG có bao thì rơi xuống đất là HỎNG."}, {"id": "NG1-3", "zh": "老人的问题让卖手机的人说不出话来。", "dung": true, "yt": "nghe ý", "cs": "nam_bai", "giai": "Câu gốc: 卖手机的人一句话也说不出来 — câu hỏi của ông cụ chỉ ra anh ta nói trước sau mâu thuẫn."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe truyện, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "一个年轻人坐船过河，手机不小心掉进了河里。水太深了，他不敢马上下去找，于是在船边画了一条线，说：“手机是从这儿掉下去的，等船停了，我再从这儿找。”船到了对面，他直接从画线的地方跳进河里，可是找了半天也没找到。船走了很远，手机却还在原来的地方。情况改变了，办法也要跟着改变。", "dich": "Có một chàng trai đi thuyền qua sông, lỡ tay làm rơi điện thoại xuống nước. Nước sâu quá, anh không dám nhảy xuống tìm ngay, thế là vạch một đường bên mạn thuyền, nói: “Điện thoại rơi xuống từ chỗ này, đợi thuyền dừng rồi mình sẽ tìm từ đây.” Thuyền sang tới bờ bên kia, anh nhảy thẳng xuống sông từ chỗ đã vạch, nhưng tìm mãi chẳng thấy. Thuyền đã đi rất xa, còn điện thoại vẫn nằm ở chỗ cũ. Tình hình đã thay đổi thì cách làm cũng phải thay đổi theo.", "cau": [{"id": "NG2-1", "hoi": "手机掉进河里以后，年轻人为什么没有马上下去找？", "yt": "nghe ý · 于是", "cs": "nam_bai", "model": "因为水太深了，他不敢马上下去。", "more": ["水太深了。", "因为河水太深了。", "他不敢下去，因为水很深。", "河里的水太深，他不敢。", "因为水深，他害怕。"], "need": [["深", "不敢"]], "avoid": [], "giai": "Câu gốc: 水太深了，他不敢马上下去找，于是在船边画了一条线 — vế trước 于是 là lý do."}, {"id": "NG2-2", "hoi": "船到了对面以后，他是从哪儿跳进河里的？", "yt": "nghe chi tiết · ★ 直接", "cs": "nam_bai", "model": "他直接从画线的地方跳进河里。", "more": ["从画线的地方。", "画线的地方。", "从船边画线的地方跳下去的。", "他从画了线的地方跳进河里。", "从那条线那儿跳下去的。"], "need": ["线"], "avoid": [], "giai": "Câu gốc: 他直接从画线的地方跳进河里 — 直接 đứng trước động từ: nhảy thẳng xuống từ chỗ đã vạch."}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "孙小雪的日记", "cau": ["来中国两个星期，我的生活改变了很多。", "在越南我习惯用现金，可是这里几乎人人都用手机支付。", "因为我不会用支付软件，于是买东西时常常很着急。", "有一次我现金不够，于是一个同学帮我付了钱。", "后来她帮我下载了软件，还教我扫码。", "现在不仅我会扫码结账，我还会在网上订票。", "网购也很方便，早上订的东西甚至下午就到了。", "手机方便是方便，不过我得管住自己，别乱花钱。"], "loi": [{"i": 2, "id": "DC1-a", "yt": "NP4 ……，于是……", "cs": "nam_bai", "model": "因为我不会用支付软件，所以买东西时常常很着急。", "more": ["我不会用支付软件，所以买东西时常常很着急。", "因为我不会用支付软件，所以常常很着急。", "因为不会用支付软件，所以买东西的时候常常很着急。", "由于我不会用支付软件，所以买东西时常常很着急。", "因为我不会用支付软件，所以我买东西时常常很着急。", "因为我不会用支付软件，买东西时常常很着急。"], "need": ["软件", "着急"], "avoid": [["于是", "于是 chỉ dùng khi KỂ một việc đã xảy ra rồi dẫn tới việc tiếp theo; không ghép với 因为, không dùng cho chuyện lặp lại (常常) → 因为……，所以……."]], "giai": "因为 đi với 所以. 于是 = “thế là”, chỉ kể MỘT chuyện đã xảy ra (câu ngay sau: 我现金不够，于是一个同学帮我付了钱)."}, {"i": 5, "id": "DC1-b", "yt": "NP2 不仅……，还……", "cs": "nam_bai", "model": "现在我不仅会扫码结账，还会在网上订票。", "more": ["我不仅会扫码结账，还会在网上订票。", "现在我不仅会扫码结账，而且会在网上订票。", "现在我不仅会扫码结账，还会网上订票。", "我现在不仅会扫码结账，还会在网上订票。", "现在我不仅会扫码结账，而且还会在网上订票。"], "need": ["不仅", ["还", "而且"], "订票"], "avoid": [["不仅我", "Hai vế cùng chủ ngữ 我 → chủ ngữ đứng TRƯỚC 不仅: 我不仅会……，还会……."]], "order": [["我", "不仅", "Chủ ngữ 我 đứng TRƯỚC 不仅."]], "giai": "Cùng một chủ ngữ: S + 不仅 A，还 / 而且 B — 我不仅会扫码结账，还会在网上订票. 不仅 đứng trước chủ ngữ chỉ khi hai vế KHÁC chủ ngữ."}], "dich": "Sang Trung Quốc được hai tuần, cuộc sống của mình thay đổi nhiều lắm. Ở Việt Nam mình quen dùng tiền mặt, vậy mà ở đây gần như ai cũng trả bằng điện thoại. Vì mình không biết dùng app thanh toán nên lúc mua đồ hay bị cuống. Có lần mình không đủ tiền mặt, thế là một bạn cùng lớp trả giúp. Sau đó bạn ấy tải app giúp mình, còn dạy mình quét mã. Giờ mình không chỉ biết quét mã tính tiền mà còn biết đặt vé trên mạng. Mua online cũng tiện lắm, sáng đặt hàng mà có khi chiều đã tới rồi. Điện thoại tiện thì tiện thật, nhưng mình phải kiềm chế bản thân, đừng tiêu tiền bừa."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "一条奇怪的信息", "van": "赵阿姨今年六十五岁，不仅学会了用手机支付，还常常在网上买东西。上个星期，她收到一条信息，说她买的东西出了问题，请她提供身份证号和银行卡密码。赵阿姨觉得有点儿奇怪，于是马上给女儿打了电话。女儿告诉她，真正的网店是不会要密码的，这条信息很可能是假的。赵阿姨听了说：“还好我先问了你。以后我再也不把个人信息__随便__告诉别人了。”", "dich": "Cô Triệu năm nay sáu mươi lăm tuổi, không chỉ học được cách trả tiền bằng điện thoại mà còn hay mua đồ trên mạng. Tuần trước cô nhận được một tin nhắn, nói hàng cô mua có vấn đề, đề nghị cô cung cấp số căn cước và mật khẩu thẻ ngân hàng. Cô Triệu thấy hơi lạ, thế là gọi ngay cho con gái. Con gái bảo cửa hàng online thật thì không bao giờ đòi mật khẩu, tin nhắn này rất có thể là giả. Cô Triệu nghe xong nói: “May mà mẹ hỏi con trước. Từ giờ mẹ không bao giờ tuỳ tiện nói thông tin cá nhân cho người khác nữa.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "赵阿姨收到信息以后，为什么先给女儿打电话？", "yt": "đọc · lý do · 于是", "cs": "nam_bai", "model": "因为她觉得这条信息有点儿奇怪。", "more": ["她觉得信息有点儿奇怪。", "因为这条信息很奇怪。", "她觉得这条信息不对。", "因为她不放心。", "她担心这条信息是假的。"], "need": [["奇怪", "不对", "不放心", "担心", "假"]], "avoid": [["出了问题", "Đó là điều tin nhắn nói — cô gọi cho con gái vì thấy tin nhắn LẠ."]], "giai": "Câu gốc: 赵阿姨觉得有点儿奇怪，于是马上给女儿打了电话 — vế trước 于是 là lý do."}, {"id": "DC2-2", "kieu": "chon", "hoi": "赵阿姨对这件事是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["觉得网购太危险，以后不再用手机买东西了", "觉得女儿想得太多，那条信息没有问题", "觉得还好先问了女儿，以后要更注意保护个人信息"], "dung": 2, "giai": "Câu cuối: 还好我先问了你。以后我再也不把个人信息随便告诉别人了 — may mà hỏi trước, từ giờ cẩn thận hơn (không hề nói bỏ mua online)."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“随便”是什么意思？请用简单的中文解释。", "yt": "★ 随便 · giải thích từ", "cs": "nam_bai", "model": "“随便”就是不认真想一想就做。", "more": ["不认真考虑就做。", "想怎么做就怎么做。", "不小心，没有多想。", "没想清楚就告诉别人。", "不注意，想给谁就给谁。"], "need": [["不认真", "想怎么", "不小心", "没有多想", "没想", "不注意", "想给谁", "不考虑", "没考虑"]], "giai": "随便 ở đây mang nghĩa xấu = làm mà không suy nghĩ, không cẩn thận: 别随便告诉别人. (Nghĩa tốt: 随便坐 = cứ ngồi tự nhiên.)"}]}], "san_pham": {"loai": "viet", "de": "你平常用手机做什么？手机给你的生活带来了哪些改变？", "de_vi": "Ngày thường em dùng điện thoại làm gì? Điện thoại đã mang lại những thay đổi gì cho cuộc sống của em?", "chu_toi_thieu": 100, "giay_toi_thieu": 90, "dan_y": [["① Mở đầu", "你用手机多长时间了？每天大概用几个小时？"], ["② Dùng để làm gì", "你平常用手机做什么？（支付 · 订票 · 网购…… 不仅……，还……）"], ["③ Thay đổi", "手机给你的生活带来了什么改变？（甚至…… · ……，于是……）"], ["④ Điều cần chú ý", "用手机有什么问题？你会怎么做？（方便是方便，就是…… · 管住自己 · 保护个人信息）"]], "tu_goi_y": ["支付", "订", "不仅", "甚至", "改变", "于是", "熟悉", "乱", "管", "保护", "随便", "网购"], "cau_truc": [["X 是 X，就是 / 不过……", ["就是"]], ["不仅……，还 / 而且……", ["不仅"]], ["甚至", ["甚至"]], ["……，于是……", ["于是"]]], "can_cau_truc": 2, "can_tu": 4, "mau": "我用手机已经十年了，每天都离不开它。我平常不仅用手机跟朋友聊天，还用它支付、订票和网购。以前出门一定要带现金，现在扫一下码就能结账，我甚至常常忘了带钱包。去年我去胡志明市旅游，对那里一点儿也不熟悉，于是用手机订了酒店，还找到了很多好吃的饭馆。不过，手机方便是方便，就是容易让人乱花钱，所以我得管住自己。另外，我也很注意保护个人信息，从来不把密码随便告诉别人。", "mau_dich": "Mình dùng điện thoại đã mười năm, ngày nào cũng không rời được nó. Ngày thường mình không chỉ dùng điện thoại nói chuyện với bạn bè mà còn dùng để thanh toán, đặt vé và mua online. Trước đây ra ngoài nhất định phải mang tiền mặt, giờ quét mã một cái là tính tiền xong, mình thậm chí hay quên cả mang ví. Năm ngoái mình đi du lịch TP. Hồ Chí Minh, chẳng quen chỗ nào cả, thế là mình đặt khách sạn bằng điện thoại, còn tìm được rất nhiều quán ăn ngon. Có điều, điện thoại tiện thì tiện thật, nhưng dễ làm người ta tiêu tiền bừa, nên mình phải kiềm chế bản thân. Ngoài ra, mình cũng rất chú ý bảo vệ thông tin cá nhân, không bao giờ tuỳ tiện nói mật khẩu cho người khác.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài (X 是 X，就是 · 不仅……还 · 甚至 · 于是)", "Từ ★ dùng đúng lúc, đúng cách", "Mạch lạc: có từ nối, ý nối nhau"]}, "audio": {"NG1": "audio-bai-03/nghe-1.m4a", "NG2": "audio-bai-03/nghe-2.m4a"}};
