window.CHE_DO = 'on';
window.DU_LIEU = {"bai": 6, "tu_hoc": [{"id": "T1", "yt": "☆ 身 (bẫy lượng từ)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Tối qua lúc ngủ mình ra mồ hôi đầm đìa khắp người.", "cau": "昨天晚上睡觉时，我出了一______汗。", "pa": ["个", "身", "件"], "dung": 1, "giai": "一身汗 = mồ hôi khắp người (身 = cả người). 个 · 件 không đi với 汗: 一个人 · 一件衣服."}, {"id": "T2", "yt": "☆ 有效 (bẫy Hán–Việt 效果)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Bác sĩ bảo tiêm sẽ HIỆU QUẢ hơn uống thuốc.", "cau": "医生说，打针比吃药更______。", "pa": ["效果", "有效", "结果"], "dung": 1, "giai": "有效 = có hiệu quả (tính từ): 更有效. 效果 là DANH TỪ (效果很好), không đứng một mình sau 更 · 结果 = kết quả."}, {"id": "T3", "yt": "☆ 国籍 (bẫy 什么国家)", "kn": "đọc", "cs": "tu_hoc", "tinh": "— Bạn quốc tịch gì? — Việt Nam.", "cau": "“你是什么______？”“越南。”", "pa": ["国家", "国籍", "地址"], "dung": 1, "giai": "国籍 = quốc tịch: 什么国籍 · 写国籍. Hỏi người nước nào thì nói 你是哪国人, không nói 你是什么国家 · 地址 = địa chỉ."}, {"id": "T4", "yt": "☆ 降", "kn": "đọc", "cs": "tu_hoc", "tinh": "Uống thuốc xong, cậu ấy hạ sốt rồi (nhiệt độ cơ thể đã hạ xuống).", "cau": "吃了药以后，他的体温______下来了。", "pa": ["高", "上", "降"], "dung": 2, "giai": "降下来 = hạ xuống: 把体温降下来. 高 là tính từ, không đi với 下来 · 上 ngược hướng với 下来."}, {"id": "T5", "yt": "☆ 地址 (bẫy Hán–Việt 地点)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Cho mình địa chỉ của cậu, mình gửi cho cậu ít đồ.", "cau": "把你的______给我吧，我给你寄点儿东西。", "pa": ["地点", "地方", "地址"], "dung": 2, "giai": "地址 = địa chỉ (để gửi đồ, ghi vào tờ khai). 地点 = địa điểm (nơi diễn ra việc gì) · 地方 = chỗ, nơi."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe truyện, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "从前，有位有名的医生去见国王，说：“您生病了，要赶快治疗。”国王说：“我身体很好，没有什么好治的。”十天后，医生又来了，说：“您的病更严重了。”国王还是不听。又过了十天，医生看了国王一眼，就走了。没过几天，国王全身疼得厉害，赶快让人去找医生，可是医生已经离开了。", "dich": "Ngày xưa, có một thầy thuốc nổi tiếng đến gặp nhà vua, nói: “Ngài bị bệnh rồi, phải mau chữa đi.” Nhà vua bảo: “Ta khoẻ lắm, có gì đâu mà phải chữa.” Mười ngày sau, thầy thuốc lại đến, nói: “Bệnh của ngài nặng hơn rồi.” Nhà vua vẫn không nghe. Mười ngày nữa trôi qua, thầy thuốc nhìn nhà vua một cái rồi bỏ đi. Chưa được mấy hôm, nhà vua đau dữ dội khắp người, vội sai người đi tìm thầy thuốc, nhưng thầy thuốc đã đi mất rồi.", "cau": [{"id": "NG1-1", "zh": "国王一开始觉得自己没有病。", "dung": true, "yt": "nghe hiểu ý · 没有什么好V的", "cs": "nam_bai", "giai": "Câu gốc: 国王说：“我身体很好，没有什么好治的。” — “khoẻ lắm, có gì đâu mà chữa” = vua nghĩ mình không bệnh."}, {"id": "NG1-2", "zh": "医生第二次来的时候，国王的病比第一次轻了。", "dung": false, "yt": "nghe hiểu ý · ★ 严重", "cs": "nam_bai", "giai": "Câu gốc: 十天后，医生又来了，说：“您的病更严重了。” — 更严重 = NẶNG HƠN, ngược với 轻 (nhẹ đi)."}, {"id": "NG1-3", "zh": "国王想治病的时候，已经来不及了。", "dung": true, "yt": "suy luận · 来不及 (Bài 4)", "cs": "nam_bai", "giai": "Bài không nói thẳng câu này, phải suy ra: 国王全身疼得厉害，赶快让人去找医生，可是医生已经离开了 — lúc vua muốn chữa thì thầy thuốc đã đi, không kịp nữa."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe truyện, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "小狗感冒了，咳嗽得很厉害。医生给了它一些药，让它每天按时吃三次。小狗觉得药太苦，偶尔才吃一次。过了两天，它感觉好一点儿了，就不吃了。没想到，第二天晚上它又发烧了，身上难受得厉害。狗妈妈赶快带它去医院。这一次，狗妈妈每天提醒它，好让它按时吃药。没过几天，小狗的病就全好了。", "dich": "Cún con bị cảm, ho dữ lắm. Bác sĩ cho nó ít thuốc, dặn mỗi ngày uống ba lần cho đúng giờ. Cún thấy thuốc đắng quá, thỉnh thoảng mới uống một lần. Được hai hôm, thấy đỡ hơn một chút là nó bỏ luôn không uống nữa. Không ngờ tối hôm sau nó lại sốt, người khó chịu kinh khủng. Chó mẹ vội đưa nó đi viện. Lần này, ngày nào chó mẹ cũng nhắc để nó uống thuốc đúng giờ. Chưa được mấy hôm, Cún đã khỏi hẳn.", "cau": [{"id": "NG2-1", "hoi": "小狗开始的时候是怎么吃药的？为什么？", "yt": "nghe chi tiết · 偶尔才 (2 ý)", "cs": "nam_bai", "model": "它偶尔才吃一次，因为它觉得药太苦。", "more": ["偶尔才吃一次，因为药太苦了。", "它没有按时吃药，因为觉得药太苦。", "它不按时吃，药太苦了。", "小狗觉得药很苦，所以偶尔才吃一次。", "药太苦，它很少吃。", "因为药太苦，它偶尔吃一次。"], "need": [["偶尔", "没有按时", "没按时", "不按时", "很少吃"], "苦"], "giai": "Câu gốc: 小狗觉得药太苦，偶尔才吃一次。 — phải đủ 2 ý: thỉnh thoảng mới uống (không đúng giờ) + vì thuốc đắng."}, {"id": "NG2-2", "hoi": "这个故事告诉我们什么？", "yt": "suy luận · bài học · ★ 按时", "cs": "nam_bai", "model": "吃药要按时，病好一点儿了也不能不吃。", "more": ["药要按时吃。", "生病的时候要按时吃药。", "感觉好一点儿了，也不能马上不吃药。", "药再苦也要按时吃，病才能好。", "不按时吃药，病会更严重。", "要听医生的话，每天按时吃药。"], "need": [["按时", "不能不吃", "不要不吃", "别不吃", "不能马上不吃", "一直吃", "吃完"]], "avoid": [["不用按时", "Ngược ý câu chuyện: Cún khỏi bệnh là nhờ uống thuốc ĐÚNG GIỜ."], ["不必按时", "Ngược ý câu chuyện: Cún khỏi bệnh là nhờ uống thuốc ĐÚNG GIỜ."]], "giai": "Bài không nói thẳng bài học. So hai lần: uống thất thường, thấy đỡ là bỏ → bệnh nặng lại; mẹ nhắc uống đúng giờ → khỏi hẳn. → 吃药要按时，感觉好一点儿也不能不吃。"}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "吴小兰的日记", "cau": ["我平时身体不错，偶尔才感冒一次。", "可是这几天天气变冷，我发烧了，还很厉害地咳嗽。", "同事知道以后，陪我去了医院。", "我们先挂号，然后排了半个小时的队。", "医生说情况不太严重，让我按时吃药，多休息。", "第二天我还是不太舒服，上班不了，只好请了一天假。", "我给妈妈打了个电话，好让她放心。", "我想请同事吃饭，他笑着说：“我们是朋友，有什么好客气的？”", "现在我感觉好多了。"], "loi": [{"i": 1, "id": "DC1-a", "yt": "NP1 V + 得 + 厉害", "cs": "nam_bai", "model": "可是这几天天气变冷，我发烧了，还咳嗽得很厉害。", "more": ["我发烧了，还咳得很厉害。", "可是这几天天气变冷，我发烧了，咳嗽得很厉害。", "还咳嗽得很厉害。", "我发烧了，还咳嗽咳得很厉害。", "可是这几天天气变冷，我发烧了，还咳得厉害。"], "need": [["咳得", "咳嗽得"], "厉害"], "order": [["咳", "厉害", "厉害 phải đứng SAU động từ + 得: 咳嗽得很厉害."]], "giai": "Mức độ của triệu chứng: V + 得 + (很) 厉害 → 咳嗽得很厉害 · 咳得很厉害. Không dịch theo trật tự “ho dữ dội” thành 很厉害地咳嗽."}, {"i": 5, "id": "DC1-b", "yt": "ôn Bài 4 · V + 不了 (động từ li hợp)", "cs": "nam_bai", "bai_cu": 4, "model": "第二天我还是不太舒服，上不了班，只好请了一天假。", "more": ["第二天我还是不太舒服，不能上班，只好请了一天假。", "我还是不太舒服，上不了班。", "上不了班，只好请了一天假。", "第二天我还是不太舒服，没办法上班，只好请了一天假。", "第二天我还是不太舒服，去不了公司，只好请了一天假。"], "need": [["上不了班", "不能上班", "没办法上班", "没法上班", "去不了公司", "不能去上班"]], "avoid": [["上班不了", "上班 là động từ li hợp: 不了 chen vào GIỮA → 上不了班 (giống 睡不着觉 · 帮不了忙)."]], "giai": "Ôn Bài 4: V + 得了 / 不了. Với động từ li hợp (上班 · 睡觉 · 帮忙), 不了 chen vào giữa: 上不了班. Không nói 上班不了."}], "dich": "Bình thường mình khá khoẻ, thỉnh thoảng mới bị cảm một lần. Nhưng mấy hôm nay trời trở lạnh, mình bị sốt, lại còn ho dữ lắm. Đồng nghiệp biết chuyện liền đưa mình đi viện. Bọn mình lấy số trước, rồi xếp hàng mất nửa tiếng. Bác sĩ bảo tình hình không nặng lắm, dặn mình uống thuốc đúng giờ, nghỉ ngơi nhiều. Hôm sau mình vẫn chưa khoẻ, không đi làm được, đành xin nghỉ một ngày. Mình gọi cho mẹ một cuộc để mẹ yên tâm. Mình định mời đồng nghiệp đi ăn, cậu ấy cười bảo: “Bạn bè với nhau, khách sáo gì chứ?” Giờ mình thấy đỡ nhiều rồi."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "杨奶奶住院了", "van": "杨奶奶今年七十多岁，上个星期突然咳嗽得很厉害，住进了医院。她的孙子在外地工作，听说以后，马上请了一个星期的假，回来__陪__奶奶。他每天给奶奶做饭，提醒她按时吃药，晚上睡在奶奶旁边。奶奶说：“你工作那么忙，别为了我请假。”孙子说：“小时候您天天照顾我，现在该我照顾您了，有什么好客气的？”一个星期以后，奶奶的病好多了。她笑着说：“有你在身边，我的病好得特别快。”", "dich": "Bà Dương năm nay hơn bảy mươi tuổi, tuần trước tự dưng ho dữ dội, phải nhập viện. Cháu trai bà làm việc ở tỉnh khác, nghe tin liền xin nghỉ một tuần về ở bên bà. Ngày nào anh cũng nấu cơm cho bà, nhắc bà uống thuốc đúng giờ, tối thì ngủ ngay cạnh bà. Bà bảo: “Con bận việc thế, đừng vì bà mà xin nghỉ.” Cháu đáp: “Hồi nhỏ ngày nào bà cũng chăm con, giờ đến lượt con chăm bà, bà khách sáo gì chứ?” Một tuần sau, bệnh của bà đỡ nhiều. Bà cười bảo: “Có con ở bên, bệnh bà khỏi nhanh hẳn.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "奶奶为什么不想让孙子请假？", "yt": "đọc · lý do (suy luận)", "cs": "nam_bai", "model": "因为她觉得孙子工作很忙，不想影响他的工作。", "more": ["孙子工作太忙了。", "因为孙子的工作那么忙。", "她怕孙子太忙。", "她不想影响孙子的工作。", "奶奶觉得孙子工作忙，不应该为了她请假。", "因为他工作很忙，请假不好。"], "need": [["忙", "影响"]], "giai": "Suy ra từ lời bà: 你工作那么忙，别为了我请假。 — bà thương cháu bận việc, không muốn làm ảnh hưởng công việc của cháu."}, {"id": "DC2-2", "kieu": "chon", "hoi": "孙子对照顾奶奶是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["很愿意照顾奶奶，觉得这是应该的", "觉得照顾奶奶太累，想早点儿回去工作", "觉得奶奶的病不严重，没必要回来"], "dung": 0, "giai": "Câu: 小时候您天天照顾我，现在该我照顾您了，有什么好客气的？ — anh thấy chăm bà là việc nên làm, rất sẵn lòng."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“陪”是什么意思？请用简单的中文解释。", "yt": "★ 陪 · giải thích từ", "cs": "nam_bai", "model": "“陪”就是跟奶奶在一起，不让她一个人。", "more": ["和奶奶在一起。", "跟奶奶一起。", "在奶奶身边。", "一直在她身边照顾她。", "和别人在一起，不让他一个人。"], "need": [["一起", "身边", "不让她一个人", "不让他一个人", "不让奶奶一个人"]], "giai": "陪 = 跟别人在一起、在他身边: 回来陪奶奶 → về ở bên bà (… 晚上睡在奶奶旁边 · 有你在身边)."}]}], "san_pham": {"loai": "noi", "de": "说说你（或者你的家人）一次生病的经历：哪儿不舒服？谁陪着去看病？看病的过程怎么样？病好了以后，你有什么想法？", "de_vi": "Kể về một lần em (hoặc người nhà em) bị ốm: khó chịu ở đâu? Ai đi khám cùng? Quá trình khám bệnh thế nào? Khỏi bệnh rồi em có suy nghĩ gì?", "chu_toi_thieu": 200, "giay_toi_thieu": 90, "dan_y": [["① Mở đầu", "你平时身体怎么样？那次是什么时候生病的？（偶尔才……）"], ["② Triệu chứng", "你哪儿不舒服？有多严重？（V / Adj + 得很厉害 · 难受 · 感觉）"], ["③ Đi khám", "谁陪你去的？看病的过程怎么样？医生怎么说？（挂号 · 排队 · 结果 · ……，好……）"], ["④ Kết", "你怎么感谢陪你的人？他说了什么？现在你有什么想法？（有什么好客气的 · 按时）"]], "tu_goi_y": ["偶尔", "厉害", "严重", "赶快", "陪", "挂号", "排队", "结果", "按时", "感觉", "难受", "情况"], "cau_truc": [["V / Adj + 得 + 厉害", ["得", "厉害"]], ["(没)有什么(好) V 的", ["什么好"]], ["偶尔(才)", ["偶尔"]], ["……，好让……", ["好让"]]], "can_cau_truc": 2, "can_tu": 4, "bat_buoc": true, "mau": "我平时身体不错，偶尔才感冒一次。可是去年冬天，河内突然变冷，我发烧到三十九度，还咳嗽得很厉害，晚上一直睡不着，身上难受极了。同事知道以后，马上说：“你别一个人在家，我陪你去医院。”到了医院，我们先挂号，然后排了一个小时的队。医生给我做了检查，检查结果出来后，他说情况不太严重，可是光吃药不够，还要打一针，好让体温快点儿降下来。他还让我按时吃药，多喝水。第二天醒来，我感觉好多了。我想请同事吃饭，他笑着说：“我们是好朋友，有什么好客气的？”从那以后，我更加注意锻炼身体了。生病的时候有人陪着，真是一件幸福的事。", "mau_dich": "Bình thường mình khá khoẻ, thỉnh thoảng mới bị cảm một lần. Nhưng mùa đông năm ngoái, Hà Nội tự dưng trở lạnh, mình sốt tới ba mươi chín độ, lại còn ho dữ lắm, tối cứ trằn trọc không ngủ được, người khó chịu vô cùng. Đồng nghiệp mình biết chuyện liền bảo: “Cậu đừng ở nhà một mình, để tớ đưa cậu đi viện.” Đến viện, bọn mình lấy số trước, rồi xếp hàng mất một tiếng. Bác sĩ khám cho mình, có kết quả xét nghiệm rồi thì bảo tình hình không nặng lắm, nhưng chỉ uống thuốc thì không đủ, phải tiêm thêm một mũi để hạ sốt cho nhanh. Bác sĩ còn dặn phải uống thuốc đúng giờ, uống nhiều nước. Sáng hôm sau ngủ dậy, mình thấy đỡ hẳn. Mình định mời đồng nghiệp đi ăn, cậu ấy cười bảo: “Bạn thân với nhau, khách sáo gì chứ?” Từ đó, mình chú ý tập thể dục hơn. Lúc ốm có người ở bên cạnh, đúng là một điều hạnh phúc.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài (V得很厉害 · 有什么好V的 · 偶尔才 · ……，好……)", "Phát âm, thanh điệu người nghe hiểu", "Nói liền mạch, đủ ≈ 90 giây"]}, "audio": {"NG1": "audio-bai-06/nghe-1.m4a", "NG2": "audio-bai-06/nghe-2.m4a"}};
