window.DU_LIEU = {"bai": 7, "tu_hoc": [{"id": "T1", "yt": "☆ 份 (lượng từ của công việc)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Anh trai mình vừa tìm được một công việc mới, lương cũng khá.", "cau": "我哥哥刚找到一______新工作，工资也不错。", "pa": ["张", "份", "本"], "dung": 1, "giai": "Đếm CÔNG VIỆC, món quà, bản giấy tờ → 份: 一份工作 · 一份礼物 · 一份计划书. 张 cho vật phẳng (giấy, bàn) · 本 cho sách vở."}, {"id": "T2", "yt": "☆ 笔 (bẫy “cây bút”)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Tháng trước anh ấy chốt được một vụ làm ăn lớn, sếp vui lắm.", "cau": "他上个月谈成了一______大生意，老板非常高兴。", "pa": ["支", "笔", "张"], "dung": 1, "giai": "⚠ 笔 ngoài nghĩa “cây bút” còn là lượng từ của KHOẢN TIỀN, VỤ LÀM ĂN: 一笔生意 · 一笔钱. Đếm cây bút thì dùng 支: 一支笔."}, {"id": "T3", "yt": "☆ 采访 (bẫy Hán–Việt “phỏng vấn”)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Để biết khách hàng nghĩ gì về sản phẩm mới, nhóm mình định đi hỏi ý kiến hai mươi khách hàng quen.", "cau": "为了了解客户对新产品的看法，我们打算______二十位老客户。", "pa": ["面试", "采访", "谈"], "dung": 1, "giai": "采访 = hỏi người khác để LẤY THÔNG TIN, Ý KIẾN (nhà báo, người làm khảo sát): 采访客户. 面试 = phỏng vấn XIN VIỆC · 谈 phải có chuyện để bàn: 跟客户谈生意."}, {"id": "T4", "yt": "☆ 进入 (kết hợp 进入社会)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Người trẻ mới bước chân vào đời thường chưa biết mình hợp với việc gì.", "cau": "刚______社会的年轻人，常常不知道自己适合做什么。", "pa": ["进入", "进去", "参加"], "dung": 0, "giai": "进入 + nơi / giai đoạn mới (văn viết): 进入社会 · 进入大学 · 进入公司. 进去 không đi với 社会 kiểu này · 参加 + hoạt động: 参加比赛 · 参加会议."}, {"id": "T5", "yt": "☆ 缺点 (ưu điểm / nhược điểm)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Nhược điểm của cậu ấy là hay đãng trí, thường nhớ nhầm giờ.", "cau": "他的______是不够细心，常常记错时间。", "pa": ["优点", "缺点", "好处"], "dung": 1, "giai": "缺点 = điểm CHƯA TỐT của người / vật; 优点 = điểm TỐT. 好处 = cái lợi của một việc (运动的好处), không dùng nói tính xấu của người."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe truyện, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "有个年轻人篮球打得特别好，大家都说他厉害。旁边一个卖油的老人只点了点头。年轻人问：“你觉得我打得不好吗？”老人拿出一个瓶口很小的瓶子，站得高高的，把油慢慢倒了进去，瓶子外面一点儿油也没有。老人说：“这没什么，我只是天天倒油，经验多了。”", "dich": "Có một chàng trai chơi bóng rổ cực giỏi, ai cũng khen anh ta giỏi. Bên cạnh có một ông lão bán dầu chỉ gật gật đầu. Chàng trai hỏi: “Ông thấy tôi chơi không giỏi à?” Ông lão lấy ra một cái chai miệng rất nhỏ, đứng thật cao rồi rót dầu từ từ vào, bên ngoài chai chẳng dính một giọt dầu nào. Ông nói: “Có gì đâu, tôi chỉ ngày nào cũng rót dầu nên quen tay thôi.”", "cau": [{"id": "NG1-1", "zh": "看年轻人打篮球的人都觉得他打得不错。", "dung": true, "yt": "nghe hiểu ý", "cs": "nam_bai", "giai": "Câu gốc: 有个年轻人篮球打得特别好，大家都说他厉害。"}, {"id": "NG1-2", "zh": "老人倒油的时候，有一些油倒到了瓶子外面。", "dung": false, "yt": "nghe hiểu ý", "cs": "nam_bai", "giai": "Câu gốc: 把油慢慢倒了进去，瓶子外面一点儿油也没有 — bên ngoài chai KHÔNG dính chút dầu nào."}, {"id": "NG1-3", "zh": "老人想让年轻人明白，做得好是因为练得多。", "dung": true, "yt": "suy luận · ★ 经验", "cs": "nam_bai", "giai": "Bài không nói thẳng, phải suy ra từ lời ông lão: 这没什么，我只是天天倒油，经验多了 — giỏi là nhờ ngày nào cũng làm, chứ không có gì đặc biệt."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe truyện, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "有个年轻人想学游泳，可是怕水，就买了很多游泳的书，在家里看了一个月。他觉得自己都会了，就跟朋友去了河边。朋友说：“既然你都学会了，就下水游一下吧。”他一跳进水里，书上的东西就全忘了，喝了好几口水，最后是朋友把他拉了上来。第二天，他没有再看书，而是一早就跟朋友去了河边。", "dich": "Có một chàng trai muốn học bơi nhưng lại sợ nước, thế là anh mua cả đống sách dạy bơi, ở nhà đọc suốt một tháng. Anh thấy mình biết hết rồi, bèn cùng bạn ra bờ sông. Bạn bảo: “Đã học xong hết rồi thì xuống nước bơi thử đi.” Anh vừa nhảy xuống nước là quên sạch những gì trong sách, uống mấy ngụm nước, cuối cùng bạn phải kéo anh lên. Hôm sau, anh không đọc sách nữa, mà sáng sớm đã cùng bạn ra bờ sông.", "cau": [{"id": "NG2-1", "hoi": "年轻人开始是怎么学游泳的？结果怎么样？", "yt": "nghe chi tiết · cách học + kết quả (2 ý)", "cs": "nam_bai", "model": "他在家里看了一个月游泳的书，可是一跳进水里就全忘了。", "more": ["在家看书，结果下水以后全忘了。", "他只看书，下水以后还是不会游。", "看了一个月的书，一下水就喝了好几口水。", "他买了很多书在家里看，结果一跳进水里就全忘了，最后朋友把他拉了上来。", "他看书学游泳，结果差点儿出事，是朋友把他拉上来的。", "看书学的，结果还是不会游。"], "need": ["书", ["忘", "喝", "拉", "不会游", "出事"]], "giai": "Câu gốc: 买了很多游泳的书，在家里看了一个月 · 他一跳进水里，书上的东西就全忘了，喝了好几口水，最后是朋友把他拉了上来 — đủ 2 ý: học bằng sách + xuống nước thì quên sạch."}, {"id": "NG2-2", "hoi": "这个故事告诉我们什么？", "yt": "suy luận · bài học · ★ 实际", "cs": "nam_bai", "model": "学东西不能只看书，还要在实际中练习。", "more": ["光看书不行，还要多练习。", "学游泳要下水练习。", "要在实际中练习。", "书看得再多，也要练习。", "只看书是学不会的，要多练。", "知识要在实际中用，才能真正学会。"], "need": [["实际", "练", "不能只", "不能光", "光看书", "只看书", "下水"]], "giai": "Bài không nói thẳng bài học. So hai cách: chỉ đọc sách → xuống nước quên sạch; hôm sau bỏ sách, ra sông → hiểu ra phải học bằng thực hành. → 书看得再多，也要在实际中练习。"}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "阮玉的工作日记", "cau": ["我在一家中国公司工作三个月了。", "刚开始，我在语言方面遇到了不少困难。", "拿来说打电话，客户说得太快，我常常听不懂。", "有一次，我没听清楚客户要的时间，差点儿出了问题。", "这件事使我明白，工作不并像我想的那么容易。", "经理对我说：“既然你知道问题在哪儿，就要多练习。”", "从那以后，我每天跟同事练习说汉语。", "遇到听不懂的地方，我会及时问清楚。", "现在，我的听力进步了很多。"], "loi": [{"i": 2, "id": "DC1-a", "yt": "NP3 拿……来说", "cs": "nam_bai", "model": "拿打电话来说，客户说得太快，我常常听不懂。", "more": ["拿打电话来说，客户说话太快，我经常听不懂。", "拿打电话来说，我常常听不懂客户的话。", "拿打电话来说吧，客户说得太快，我常常听不懂。", "拿和客户打电话来说，他们说得太快，我常常听不懂。", "拿打电话来说，客户说得很快，我常听不懂。"], "need": ["拿", "打电话", "来说"], "order": [["拿", "打电话", "拿 đứng trước ví dụ: 拿 + 打电话 + 来说."], ["打电话", "来说", "Ví dụ đặt GIỮA 拿 và 来说: 拿打电话来说."]], "giai": "拿 + ví dụ + 来说 = lấy … làm ví dụ. Ví dụ phải nằm GIỮA 拿 và 来说: 拿打电话来说 — không theo trật tự tiếng Việt “lấy ví dụ là gọi điện”."}, {"i": 4, "id": "DC1-b", "yt": "ôn Bài 2 · 并不", "cs": "nam_bai", "bai_cu": 2, "model": "这件事使我明白，工作并不像我想的那么容易。", "more": ["工作并不像我想的那么容易。", "这件事使我明白，工作并没有我想的那么容易。", "这件事让我明白，工作并不像我想的那么容易。", "这件事使我明白：工作并不那么容易。", "这件事使我明白，工作并不像我想的那样容易。"], "need": [["并不", "并没有"]], "avoid": [["不并", "并 đứng TRƯỚC 不 / 没: 并不像 · 并没有."]], "giai": "Ôn Bài 2: 并 + 不 / 没 để phủ định điều mình tưởng (thật ra không phải vậy): 并不像我想的那么容易. Thứ tự luôn là 并不, không nói 不并."}], "dich": "Mình làm ở một công ty Trung Quốc được ba tháng rồi. Lúc đầu, mình gặp không ít khó khăn về mặt ngôn ngữ. Lấy chuyện nghe điện thoại làm ví dụ, khách hàng nói nhanh quá, mình thường nghe không hiểu. Có lần, mình nghe không rõ giờ khách hẹn, suýt nữa gây ra chuyện. Chuyện đó làm mình hiểu ra, đi làm không hề dễ như mình tưởng. Sếp bảo mình: “Đã biết vấn đề nằm ở đâu thì phải chịu khó luyện.” Từ đó, ngày nào mình cũng luyện nói tiếng Trung với đồng nghiệp. Gặp chỗ nghe không hiểu là mình hỏi lại cho rõ ngay. Giờ thì khả năng nghe của mình đã tiến bộ nhiều."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "杜梅的暑假打工", "van": "大学三年级的暑假，杜梅在河内一家咖啡店打工。第一个星期，她常常记错客人点的东西，有时还算错钱。店长没有批评她，而是让她把每天遇到的问题写在本子上。杜梅发现，很多错误其实都是因为她不够细心。两个月下来，她不但能很快记住客人的要求，还学会了怎么和不同的客人交流。她说：“打工虽然很累，但是让我__积累__了不少经验，这些是课本上学不到的。”", "dich": "Kỳ nghỉ hè năm ba đại học, Đỗ Mai làm thêm ở một quán cà phê tại Hà Nội. Tuần đầu, cô hay nhớ nhầm món khách gọi, có lúc còn tính nhầm tiền. Quản lý quán không trách cô, mà bảo cô ghi lại vào sổ những vấn đề gặp phải mỗi ngày. Đỗ Mai nhận ra rất nhiều lỗi thật ra là do mình chưa đủ cẩn thận. Sau hai tháng, cô không chỉ nhớ được yêu cầu của khách rất nhanh, mà còn học được cách nói chuyện với từng kiểu khách khác nhau. Cô nói: “Đi làm thêm tuy mệt, nhưng giúp mình tích luỹ được khá nhiều kinh nghiệm, mấy thứ này sách vở không dạy được.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "店长为什么让杜梅把每天遇到的问题写在本子上？", "yt": "đọc · lý do (suy luận)", "cs": "nam_bai", "model": "好让她自己发现常常出错的原因。", "more": ["让她找到自己的问题。", "让她知道自己为什么常常出错。", "店长想让她自己发现问题在哪儿。", "这样她能明白自己错在哪儿。", "为了让她发现自己不够细心。", "让她自己找出出错的原因，以后少出错。"], "need": [["发现", "找到", "找出", "知道", "明白", "原因", "为什么"]], "giai": "Suy ra từ câu ngay sau: 杜梅发现，很多错误其实都是因为她不够细心 — ghi lại là để cô TỰ nhận ra mình sai ở đâu, vì sao sai (chứ không phải để phạt)."}, {"id": "DC2-2", "kieu": "chon", "hoi": "杜梅对这次打工是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["虽然很累，但是觉得学到了很多", "觉得太累了，以后再也不想打工了", "觉得学到的东西跟课本上的一样"], "dung": 0, "giai": "Câu cuối: 打工虽然很累，但是让我积累了不少经验，这些是课本上学不到的 — 虽然……但是…… nhấn vào vế sau: cô thấy mình học được nhiều."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“积累”是什么意思？请用简单的中文解释。", "yt": "★ 积累 · giải thích từ", "cs": "nam_bai", "model": "“积累”就是一点一点地变多。", "more": ["慢慢地变多。", "一点儿一点儿地多起来。", "时间长了，慢慢有了很多。", "一点一点地得到，越来越多。", "慢慢得到很多。"], "need": [["一点一点", "一点儿一点儿", "慢慢", "越来越多", "多起来"]], "giai": "积累 = gom dần từng chút qua thời gian: 积累经验 · 慢慢积累."}]}], "san_pham": {"loai": "viet", "de": "写一写你从一份工作（或者打工、实习）中学到了什么：你做的是什么工作？遇到过什么困难？后来是怎么做的？", "de_vi": "Kể về những gì em học được từ một công việc (hoặc việc làm thêm, thực tập): em làm việc gì? Từng gặp khó khăn gì? Sau đó em đã làm thế nào?", "chu_toi_thieu": 100, "giay_toi_thieu": 90, "dan_y": [["① Giới thiệu công việc", "你在哪儿、什么时候做过什么工作？（一份…… · 打工 · 出差）"], ["② Khó khăn gặp phải", "刚开始遇到了什么困难？（在……方面 · 拿……来说）"], ["③ Em đã làm thế nào", "后来你是怎么做的？谁帮助了你？（既然……，就…… · 提前 · 及时 · 改）"], ["④ Học được gì", "这份工作使你明白了什么？（使 · 积累经验 · 能力 · 基础）"]], "tu_goi_y": ["经验", "积累", "困难", "细心", "及时", "提前", "改", "能力", "基础", "效果", "实际", "份"], "cau_truc": [["在……方面", ["在", "方面"]], ["既然……，就……", ["既然"]], ["拿……来说", ["拿", "来说"]], ["S + 使 + O + V/Adj", ["使"]]], "can_cau_truc": 2, "can_tu": 4, "bat_buoc": true, "mau": "大二的暑假，我在河内一家卖衣服的商店打工。刚开始，我觉得这份工作很简单，实际做起来才发现困难不少。拿介绍衣服来说，我只会说“这件很好看”，客人听了都不太想买。店长告诉我，要先了解客人的需要，再介绍合适的衣服。从那以后，我每天都细心地看别的同事怎么跟客人交流。一个月以后，在我这儿买衣服的客人越来越多了，这使我很有信心。这份工作让我明白：经验是在实际工作中慢慢积累的。", "mau_dich": "Hè năm hai đại học, mình làm thêm ở một cửa hàng quần áo tại Hà Nội. Lúc đầu mình nghĩ việc này đơn giản lắm, bắt tay vào làm thật mới thấy khó khăn chẳng ít. Ví dụ như giới thiệu quần áo, mình chỉ biết nói “Cái này đẹp lắm”, khách nghe xong chẳng mấy ai muốn mua. Chị quản lý bảo mình phải tìm hiểu khách cần gì trước, rồi mới giới thiệu đồ hợp với họ. Từ đó, ngày nào mình cũng để ý kỹ xem các anh chị đồng nghiệp nói chuyện với khách thế nào. Một tháng sau, khách mua đồ chỗ mình ngày càng đông, điều đó làm mình tự tin hẳn. Công việc này giúp mình hiểu ra: kinh nghiệm là thứ tích luỹ dần trong công việc thực tế.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài (在……方面 · 既然……就…… · 拿……来说 · 使)", "Từ ★ dùng đúng lúc, đúng cách", "Mạch lạc: có từ nối, ý nối nhau"]}, "audio": {"NG1": "audio-bai-07/nghe-1.m4a", "NG2": "audio-bai-07/nghe-2.m4a"}};
