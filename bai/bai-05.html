window.DU_LIEU = {"bai": 5, "tu_hoc": [{"id": "T1", "yt": "☆ 汤 (bẫy “ăn canh”)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Trời lạnh, mình ăn một bát canh nóng, thấy dễ chịu hẳn.", "cau": "天冷了，我______了一碗热汤，舒服多了。", "pa": ["吃", "喝", "用"], "dung": 1, "giai": "Tiếng Việt “ăn canh”, tiếng Trung phải nói 喝汤. 吃 dùng cho cơm, thức ăn: 吃饭 · 吃菜."}, {"id": "T2", "yt": "☆ 主人 (bẫy 房东)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Lúc ngồi vào bàn, chủ nhà (người mời) mời khách ngồi trước.", "cau": "大家坐下时，______会请客人先坐。", "pa": ["房东", "主人", "老板"], "dung": 1, "giai": "主人 = chủ nhà, người MỜI khách. 房东 = chủ nhà CHO THUÊ · 老板 = ông chủ cửa hàng, công ty."}, {"id": "T3", "yt": "☆ 年龄 (bẫy 岁)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Ở bữa tiệc trang trọng, có thể xếp chỗ theo tuổi tác lớn nhỏ.", "cau": "正式聚餐时，可以按照______大小来安排座位。", "pa": ["年龄", "岁", "年级"], "dung": 0, "giai": "年龄 = tuổi tác (danh từ, trang trọng): 年龄大小. 岁 đứng sau con số: 二十岁 · 年级 = khối lớp."}, {"id": "T4", "yt": "☆ 倒 dào (rót)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Phục vụ ơi, rót giúp tôi một cốc nước.", "cau": "服务员，请给我______一杯水。", "pa": ["倒", "吃", "喝"], "dung": 0, "giai": "倒 dào = rót, đổ chất lỏng: 倒水 · 倒上辣椒油. 喝 = uống (người uống là mình, không “给我喝”) · 吃 = ăn."}, {"id": "T5", "yt": "☆ 正式 (bẫy Hán–Việt)", "kn": "đọc", "cs": "tu_hoc", "tinh": "Hôm nay là bữa tiệc TRANG TRỌNG của công ty, phải ăn mặc đẹp một chút.", "cau": "今天是公司的______聚餐，要穿得好看一点儿。", "pa": ["随意", "正式", "普通"], "dung": 1, "giai": "⚠ 正式 không chỉ là “chính thức” — còn là TRANG TRỌNG, theo nghi thức: 正式聚餐. 普通 = bình thường · 随意 = tuỳ ý, thoải mái."}], "nghe": [{"id": "NG1", "loai": "dung_sai", "ten": "Nghe đoạn văn, phán đoán đúng (√) hay sai (×)", "huong_dan": "Đọc trước 3 câu bên dưới, rồi bấm nghe. Mỗi đoạn được nghe 2 lần.", "loi": "从前，有几个人得到了一瓶酒。大家各喝各的肯定不够，有人说：“我们比赛画鱼吧，谁先画完，酒就给谁。”一个人很快画好了，看别人还没画完，就说：“我还能给鱼画上脚！”等他画完脚，另一个人已经画好了鱼。那个人拿过酒说：“鱼没有脚，你画的不是鱼。”说完就把酒喝了。事情做好了就够了，别再做没用的事。", "dich": "Ngày xưa, có mấy người được cho một bình rượu. Mỗi người uống một ít thì chắc chắn không đủ, có người bảo: “Mình thi vẽ cá đi, ai vẽ xong trước thì rượu là của người đó.” Một người vẽ xong rất nhanh, thấy người khác còn chưa xong bèn nói: “Mình còn vẽ thêm chân cho cá được nữa cơ!” Đợi anh ta vẽ xong chân thì một người khác đã vẽ xong con cá. Người đó cầm lấy rượu nói: “Cá làm gì có chân, cái anh vẽ đâu phải con cá.” Nói xong uống luôn bình rượu. Việc đã làm tốt là đủ rồi, đừng làm thêm những thứ vô ích.", "cau": [{"id": "NG1-1", "zh": "大家用画画比赛来决定谁喝酒。", "dung": true, "yt": "nghe chi tiết", "cs": "nam_bai", "giai": "Câu gốc: 我们比赛画鱼吧，谁先画完，酒就给谁 — thi vẽ cá, ai xong trước được rượu."}, {"id": "NG1-2", "zh": "第一个画完鱼的人最后喝到了酒。", "dung": false, "yt": "nghe chi tiết · 等……", "cs": "nam_bai", "giai": "Câu gốc: 等他画完脚，另一个人已经画好了鱼……说完就把酒喝了 — người vẽ xong trước mải vẽ chân, rượu về tay NGƯỜI KHÁC."}, {"id": "NG1-3", "zh": "酒很多，每个人都能喝到不少。", "dung": false, "yt": "nghe chi tiết · 各V各的 · 不够", "cs": "nam_bai", "giai": "Câu gốc: 有几个人得到了一瓶酒。大家各喝各的肯定不够 — chỉ một bình, chia nhau thì KHÔNG đủ."}]}, {"id": "NG2", "loai": "go", "ten": "Nghe đoạn văn, gõ câu trả lời bằng tiếng Trung", "huong_dan": "Đọc trước 2 câu hỏi, rồi bấm nghe. Mỗi đoạn được nghe 2 lần. Trả lời ngắn, đủ ý là được.", "loi": "小猫请小鸟来家里吃饭，还专门做了鱼汤。它把汤倒在盘子里，自己很快就喝完了。小鸟的嘴又长又细，一口也喝不到。小猫问：“汤够不够？不够我再给你倒。”第二天，小鸟请小猫吃饭，把汤倒在又高又细的瓶子里，自己喝得很开心，小猫却一口也喝不到。小猫这才明白：请客时，至少要想一想客人怎么吃。", "dich": "Mèo con mời Chim non đến nhà ăn cơm, còn nấu riêng một nồi canh cá. Mèo đổ canh ra đĩa, tự mình húp một loáng là hết. Mỏ Chim vừa dài vừa nhỏ, chẳng uống được ngụm nào. Mèo còn hỏi: “Canh đủ không? Không đủ tớ rót thêm cho.” Hôm sau, Chim mời Mèo ăn cơm, đổ canh vào cái bình vừa cao vừa hẹp, mình thì uống ngon lành, còn Mèo chẳng uống được ngụm nào. Lúc ấy Mèo mới hiểu: mời khách thì ít ra cũng phải nghĩ xem khách ăn thế nào.", "cau": [{"id": "NG2-1", "hoi": "小鸟为什么喝不到小猫做的汤？", "yt": "nghe chi tiết · lý do", "cs": "nam_bai", "model": "因为汤在盘子里，小鸟的嘴又长又细。", "more": ["小鸟的嘴又长又细。", "因为汤倒在盘子里。", "它的嘴太长了。", "因为嘴又长又细，盘子里的汤喝不到。", "汤在盘子里，小鸟的嘴太细了。"], "need": [["嘴", "盘"]], "avoid": [["瓶", "Bình là chỗ Chim đổ canh ở hôm sau; canh của Mèo đựng trong ĐĨA."]], "giai": "Câu gốc: 它把汤倒在盘子里……小鸟的嘴又长又细，一口也喝不到."}, {"id": "NG2-2", "hoi": "第二天小鸟请客时，把汤倒在了什么里？", "yt": "nghe chi tiết · ☆ 倒", "cs": "nam_bai", "model": "倒在又高又细的瓶子里。", "more": ["瓶子里。", "一个瓶子里。", "又高又细的瓶子。", "它把汤倒在瓶子里。", "小鸟把汤倒在了高高的瓶子里。"], "need": ["瓶"], "avoid": [["盘", "Đĩa là chỗ Mèo đổ canh hôm trước; hôm sau Chim dùng BÌNH cao, hẹp."]], "giai": "Câu gốc: 第二天，小鸟请小猫吃饭，把汤倒在又高又细的瓶子里 — 倒 dào = đổ, rót."}]}], "doc": [{"id": "DC1", "loai": "tim_loi", "ten": "Đọc nhật ký, tìm 2 câu sai ngữ pháp rồi sửa lại", "huong_dan": "Bấm vào câu em thấy sai (chọn đúng 2 câu), rồi gõ lại câu đó cho đúng.", "tieu_de": "高月的日记", "cau": ["今天我过生日，朋友们请我吃中餐。", "那家饭店很有名，我们排队等了半个小时至少。", "大家怕菜不够，点了七八道菜。", "服务员说有一道鱼特别辣，问我敢不敢吃。", "我尝了一口，真是够辣的，不过非常好吃！", "吃饭时，大家没有各玩各的手机，一直边吃边聊。", "朋友们还买了蛋糕，说大家吃完饭等，再一起吃蛋糕。", "结账时我想付钱，可是朋友们不让我付。", "这是我最开心的一个生日。"], "loi": [{"i": 1, "id": "DC1-a", "yt": "NP1 至少", "cs": "nam_bai", "model": "那家饭店很有名，我们排队等了至少半个小时。", "more": ["我们至少排队等了半个小时。", "我们排队至少等了半个小时。", "那家饭店很有名，我们至少等了半个小时。", "我们排队等了至少半个小时。", "那家饭店很有名，我们排队至少等了半个小时。"], "need": ["至少", "半个小时"], "avoid": [["小时至少", "至少 đứng TRƯỚC con số: 至少半个小时 / 至少等了半个小时."]], "order": [["至少", "半个小时", "至少 phải đứng trước 半个小时."]], "giai": "至少 + số lượng (hoặc 至少 + động từ): 等了至少半个小时 · 至少等了半个小时. Không đặt 至少 sau con số như tiếng Việt “nửa tiếng ít nhất”."}, {"i": 6, "id": "DC1-b", "yt": "NP4 等……再……", "cs": "nam_bai", "model": "朋友们还买了蛋糕，说等大家吃完饭，再一起吃蛋糕。", "more": ["说等大家吃完饭，再一起吃蛋糕。", "等大家吃完饭，再一起吃蛋糕。", "等吃完饭，再一起吃蛋糕。", "朋友们说等大家吃完饭再吃蛋糕。", "朋友们还买了蛋糕，说等我们吃完饭，再一起吃。"], "need": ["等", "再"], "avoid": [["饭等", "等 đứng ĐẦU vế trước: 等大家吃完饭，再…… — không đặt sau 吃完饭."]], "order": [["等", "吃完", "等 phải đứng trước 吃完饭: 等大家吃完饭，再……."]], "giai": "等 + việc A，再 + việc B = đợi A xong rồi mới B. 等 đứng ĐẦU câu / đầu vế: 等大家吃完饭，再一起吃蛋糕."}], "dich": "Hôm nay sinh nhật mình, các bạn mời mình đi ăn món Trung. Quán đó nổi tiếng lắm, bọn mình xếp hàng đợi ít nhất nửa tiếng. Cả bọn sợ không đủ ăn nên gọi bảy tám món. Phục vụ bảo có một món cá cay lắm, hỏi mình có dám ăn không. Mình nếm một miếng — cay ghê, nhưng ngon cực! Lúc ăn, không ai cắm mặt vào điện thoại của mình, cả bọn vừa ăn vừa nói chuyện suốt. Các bạn còn mua bánh kem, bảo đợi ăn cơm xong rồi mới cùng ăn bánh. Lúc tính tiền mình định trả, nhưng các bạn không cho. Đây là sinh nhật vui nhất của mình."}, {"id": "DC2", "loai": "hoi", "ten": "Đọc đoạn văn, trả lời câu hỏi", "huong_dan": "Đọc đoạn văn rồi trả lời. Câu gõ: trả lời ngắn bằng tiếng Trung, đủ ý là được.", "tieu_de": "黄海去同事家吃饭", "van": "上个月，同事小马请黄海去他家吃饭。小马的妈妈做了一桌子菜，还专门为他做了一道越南菜。吃饭以前，小马的爸爸请黄海坐在面对门口的座位上。黄海觉得很不好意思，因为小马的爷爷年龄最大。小马告诉他，在他们家，客人最重要，所以要请客人先坐。黄海发现，中国人吃饭时很__重视__座位的安排。他说：“虽然有点儿麻烦，但是我觉得很有意思，也能看出主人对客人的尊重。”", "dich": "Tháng trước, anh đồng nghiệp Tiểu Mã mời Hoàng Hải về nhà ăn cơm. Mẹ Tiểu Mã nấu cả một bàn đầy món, còn làm riêng cho anh một món Việt. Trước khi ăn, bố Tiểu Mã mời Hoàng Hải ngồi ở chỗ quay mặt ra cửa. Hoàng Hải thấy ngại lắm, vì ông của Tiểu Mã lớn tuổi nhất. Tiểu Mã bảo, ở nhà anh, khách là quan trọng nhất, nên phải mời khách ngồi trước. Hoàng Hải nhận ra người Trung Quốc khi ăn uống rất coi trọng việc xếp chỗ ngồi. Anh nói: “Tuy hơi rườm rà, nhưng mình thấy rất thú vị, lại còn thấy được chủ nhà tôn trọng khách thế nào.”", "cau": [{"id": "DC2-1", "kieu": "go", "hoi": "小马的爸爸请黄海坐下时，黄海为什么觉得不好意思？", "yt": "đọc · lý do", "cs": "nam_bai", "model": "因为小马的爷爷年龄最大，他觉得应该请爷爷坐那儿。", "more": ["因为爷爷年龄最大。", "小马的爷爷年龄最大。", "他觉得爷爷应该坐在那儿。", "因为爷爷的年龄比他大。", "因为桌上爷爷的年龄最大，应该请爷爷先坐。"], "need": ["爷爷"], "avoid": [["客人最重要", "“客人最重要” là lời Tiểu Mã giải thích vì sao mời khách ngồi trước, không phải lý do Hoàng Hải thấy ngại."]], "giai": "Câu gốc: 黄海觉得很不好意思，因为小马的爷爷年龄最大 — anh thấy ông lớn tuổi nhất mới nên ngồi chỗ đó."}, {"id": "DC2-2", "kieu": "chon", "hoi": "黄海对中国人吃饭时的座位安排是什么态度？", "yt": "đọc · thái độ", "cs": "nam_bai", "pa": ["觉得有点儿麻烦，但是很有意思", "觉得太麻烦了，一点儿意思也没有", "觉得跟越南完全相同，没什么特别的"], "dung": 0, "giai": "Câu cuối: 虽然有点儿麻烦，但是我觉得很有意思 — 虽然……但是…… nhấn vào vế sau: anh thấy thú vị."}, {"id": "DC2-3", "kieu": "go", "hoi": "文中画线的词“重视”是什么意思？请用简单的中文解释。", "yt": "★ 重视 · giải thích từ", "cs": "nam_bai", "model": "“重视”就是“觉得很重要”的意思。", "more": ["觉得很重要。", "认为很重要。", "非常注意。", "把它看得很重要。", "觉得这件事很重要，很注意它。"], "need": [["重要", "注意"]], "giai": "重视 + VIỆC = coi việc đó là quan trọng: 重视座位的安排. Kính trọng NGƯỜI thì dùng 尊重."}]}], "san_pham": {"loai": "viet", "de": "介绍一道你最喜欢的越南菜：它是什么味道的？怎么做？你一般什么时候、和谁一起吃？", "de_vi": "Giới thiệu một món Việt em thích nhất: vị thế nào? Làm ra sao? Em thường ăn khi nào, với ai?", "chu_toi_thieu": 100, "giay_toi_thieu": 90, "dan_y": [["① Giới thiệu món", "你最喜欢的越南菜是什么？是什么味道的？（酸 · 甜 · 咸 · 辣 · 够……的）"], ["② Cách làm", "这道菜怎么做？（先……，再……，最后…… · 煮熟 · 倒上……）"], ["③ Khi nào, với ai", "你多长时间吃一次？和谁一起吃？（至少…… · 专门 · 聚餐 · 各付各的）"], ["④ Kết", "吃这道菜时有什么习惯？你为什么最喜欢它？（等……，再……）"]], "tu_goi_y": ["道", "专门", "熟", "至少", "够", "敢", "相同", "聚餐", "各", "付", "酸", "汤"], "cau_truc": [["至少 + số lượng", ["至少"]], ["够……的 / 不够", ["够"]], ["各 V 各的", ["各的"]], ["等……，再……", ["等", "再"]]], "can_cau_truc": 2, "can_tu": 4, "mau": "我最喜欢的越南菜是酸鱼汤。这道菜又酸又甜，还有一点儿辣，味道很特别。做法并不难：先用水把鱼煮熟，再放进西红柿和别的菜，最后倒上一点儿辣椒油。夏天的时候，妈妈每个星期至少做两次。我妹妹不敢吃辣，所以妈妈会专门给她留一碗不辣的。和朋友聚餐时，我也常点这道菜，第一次吃的朋友都说：“这个汤真够酸的！”我们一般各付各的，觉得这样很轻松。在家吃饭的时候，我们都要等奶奶先喝一口汤，再开始吃。对我来说，这就是家的味道。", "mau_dich": "Món Việt mình thích nhất là canh chua cá. Món này vừa chua vừa ngọt, lại hơi cay, hương vị rất đặc biệt. Cách nấu chẳng khó gì: luộc chín cá bằng nước trước, rồi cho cà chua với các loại rau vào, cuối cùng rưới chút dầu ớt lên. Mùa hè, mẹ mình tuần nào cũng nấu ít nhất hai lần. Em gái mình không dám ăn cay, nên mẹ sẽ để riêng cho em một bát không cay. Đi ăn với bạn bè mình cũng hay gọi món này, bạn nào ăn lần đầu cũng kêu: “Canh này chua thật đấy!” Bọn mình thường ai trả phần nấy, thấy vậy thoải mái hơn. Ở nhà, lúc ăn cơm cả nhà đều đợi bà húp một ngụm canh trước rồi mới bắt đầu ăn. Với mình, đó chính là hương vị của nhà.", "tieu_chi": ["Đúng đề, đủ 4 ý của dàn ý", "Dùng đúng cấu trúc của bài (至少 · 够 · 各V各的 · 等……再……)", "Từ ★ dùng đúng lúc, đúng cách", "Mạch lạc: có từ nối, ý nối nhau"]}, "audio": {"NG1": "audio-bai-05/nghe-1.m4a", "NG2": "audio-bai-05/nghe-2.m4a"}};
